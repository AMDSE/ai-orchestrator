<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Orchestrator — 双脑协作工作台</title>
  <meta name="description" content="Orchestrator：高性能策略脑（框架与高难度攻坚）+ 较低性能执行脑（剩余任务落地），OpenAI 兼容外接 API，支持真实联网检索。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部导航 -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-mark">◈</span>
          <span class="brand-name">Orchestrator</span>
          <span class="brand-ver">v3.2</span>
        </div>
        <div class="brand-desc">双脑协作工作台 · 策略 × 执行</div>
      </div>
      <div class="topbar-right">
        <span class="health-indicator" id="healthIndicator">
          <span class="dot dot-green"></span><span>运行正常</span>
        </span>
        <span class="stat-chip">并行 <strong id="activeCount">0</strong>/3</span>
        <span class="stat-chip">项目 <strong id="projectCount">0</strong></span>
        <div class="win-controls" id="winControls" style="display:none">
          <button class="win-btn" id="winMin" title="最小化">–</button>
          <button class="win-btn" id="winMax" title="最大化">□</button>
          <button class="win-btn win-close" id="winClose" title="关闭">✕</button>
        </div>
      </div>
    </header>

    <div class="shell">
      <!-- 左侧深色导航栏 -->
      <aside class="rail">
        <div class="rail-scroll">
          <section class="rail-sec">
            <div class="rail-label">新建项目</div>
            <div class="new-card">
              <textarea id="projectInput" rows="3" placeholder="描述一个想法，策略脑将拆解框架并分配任务…"></textarea>
              <button class="btn-accent" id="createProjectBtn" onclick="createProject()">
                <span class="btn-accent-dot"></span> 启动编排
              </button>
            </div>
          </section>

          <section class="rail-sec">
            <div class="rail-label">配置</div>

            <div class="rg">
              <button class="rg-head" onclick="toggleGlobalConfig()">
                <span class="rg-ico">◎</span><span>模型与接口</span>
                <span class="rg-caret" id="configToggleIcon">⌄</span>
              </button>
              <div class="rg-body" id="globalConfigBody" style="display:none">
                <div class="rg-block">
                  <div class="rg-row">
                    <span class="rg-title">策略脑 <em>高性能</em></span>
                    <label class="sw">
                      <input type="checkbox" id="plannerWebSearchToggle" checked />
                      <span class="sw-track"></span><span class="sw-txt">联网</span>
                    </label>
                  </div>
                  <div class="rg-fields">
                    <input type="text" id="plannerBaseUrl" placeholder="接口地址 Base URL" />
                    <input type="password" id="plannerApiKey" placeholder="API Key" />
                    <input type="text" id="plannerCustomModel" placeholder="模型 (高性能，如 gpt-4o)" />
                  </div>
                </div>
                <div class="rg-block">
                  <div class="rg-row">
                    <span class="rg-title">执行脑 <em>低性能</em></span>
                    <label class="sw">
                      <input type="checkbox" id="executorWebSearchToggle" checked />
                      <span class="sw-track"></span><span class="sw-txt">联网</span>
                    </label>
                  </div>
                  <div class="rg-fields">
                    <input type="text" id="executorBaseUrl" placeholder="接口地址 Base URL" />
                    <input type="password" id="executorApiKey" placeholder="API Key" />
                    <input type="text" id="executorCustomModel" placeholder="模型 (低性能，如 gpt-4o-mini)" />
                  </div>
                </div>
                <div class="rg-block">
                  <div class="rg-row">
                    <span class="rg-title">迭代轮数</span>
                    <div class="iter-ctl">
                      <input type="number" id="maxIterationsInput" value="3" min="1" max="10" />
                      <span>轮</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="rg">
              <button class="rg-head" onclick="toggleSkillMenu()">
                <span class="rg-ico">◇</span><span>应用技能 · <strong id="selectedSkillName">B站 Toy</strong></span>
                <span class="rg-caret" id="skillArrow">⌄</span>
              </button>
              <div class="rg-body" id="skillDropdown" style="display:none"></div>
            </div>

            <div class="rg">
              <button class="rg-head" onclick="toggleAlchemyPanel()">
                <span class="rg-ico">✦</span><span>技能工坊</span>
                <span class="rg-caret" id="alchemyArrow">⌄</span>
              </button>
              <div class="rg-body" id="alchemyBody" style="display:none">
                <label class="rg-field-label" for="alchemyUrls">信源地址</label>
                <textarea id="alchemyUrls" rows="2" placeholder="每行一个 URL 或仓库…"></textarea>
                <label class="rg-field-label" for="alchemyInstruction">补充要求</label>
                <input type="text" id="alchemyInstruction" placeholder="可选，如关注某类规范…" />
                <button class="btn-sub" id="alchemyRunBtn" onclick="runSkillAlchemy()">提炼并生成技能</button>
                <div class="alch-status" id="alchemyStatusBox" style="display:none">
                  <div class="alch-stage" id="alchemyStageIndicator"><span class="spinner"></span> 处理中…</div>
                  <div class="alch-stream" id="alchemyStreamOutput"></div>
                </div>
              </div>
            </div>
          </section>

          <section class="rail-sec grow">
            <div class="rail-label">项目</div>
            <div class="project-list" id="projectList"></div>
          </section>
        </div>
      </aside>

      <!-- 主工作台 -->
      <main class="stage">
        <div class="projects-grid" id="projectsGrid"></div>

        <!-- 项目工作区 -->
        <section class="workspace" id="messageArea" style="display:none">
          <div class="ws-head">
            <div class="ws-title-box">
              <h1 id="selectedProjectTitle">未选择项目</h1>
              <div class="ws-meta">
                <span class="status-pill" id="selectedProjectStatus">—</span>
                <span class="iter-pill" id="iterationDisplay">第 1 / 3 轮</span>
                <select id="executorModelSelect" onchange="changeExecutorModel(this.value)">
                  <option value="gpt-4o-mini">gpt-4o-mini · 低性能</option>
                  <option value="gpt-4o">gpt-4o</option>
                  <option value="claude-sonnet-4.6">Claude Sonnet 4.6</option>
                  <option value="deepseek-chat">DeepSeek Chat</option>
                  <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5-7B · 低性能</option>
                </select>
              </div>
            </div>
            <div class="ws-actions">
              <button class="btn-ghost" onclick="openReview(selectedProjectId)" title="打开审查台">查看成果</button>
              <button class="btn-ghost" onclick="exportResult()" title="导出结果">导出</button>
              <button class="btn-ghost" onclick="clearMessages()" title="清空显示">清空</button>
            </div>
          </div>

          <!-- 执行过程 -->
          <div class="proc">
            <button class="proc-head" onclick="toggleThoughts()">
              <span>执行过程</span>
              <span class="proc-caret" id="thoughtsToggleIcon">⌄</span>
            </button>
            <div class="proc-body" id="thoughtsBody">
              <div class="proc-empty" id="thoughtPlaceholder">等待策略脑 / 执行脑输出…</div>
            </div>
          </div>

          <!-- 输出日志 -->
          <div class="outlog" id="messagesContainer"></div>
          <div class="stream-panel" id="streamOutput"></div>

          <!-- 介入栏 -->
          <div class="intervene">
            <div class="attach-list" id="attachmentPreview"></div>
            <div class="at-menu" id="atMenu" style="display:none">
              <div class="at-item" data-value="@策略脑 ">策略脑 — 规划与回答</div>
              <div class="at-item" data-value="@执行脑 ">执行脑 — 生成与落地</div>
              <div class="at-item" data-value="@全体 ">全体 — 双脑协同调整</div>
            </div>
            <div class="intervene-bar">
              <button class="btn-attach" onclick="triggerFileInput()" title="上传参考文件">＋</button>
              <input type="file" id="interveneFileInput" multiple style="display:none" onchange="handleFileSelect(event)" />
              <input type="text" id="interveneInput" placeholder="输入介入指导，@ 可指定目标脑…" onkeydown="handleInterveneKey(event)" oninput="handleInterveneInput(event)" />
              <button class="btn-stop" id="stopBtn" onclick="stopGeneration()" title="中止" style="display:none">中止</button>
              <button class="btn-retry" id="retryBtn" onclick="retryProject()" title="重试" style="display:none">重试</button>
              <button class="btn-send" id="interveneBtn" onclick="sendIntervention()">发送</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- 审查台 -->
    <div class="review-panel" id="reviewPanel">
      <div class="review-head">
        <h3>成果审查</h3>
        <button class="close-btn" onclick="closeReview()">✕</button>
      </div>
      <div class="review-tabs">
        <button class="tab-btn active" data-tab="result" onclick="switchTab('result')">成果</button>
        <button class="tab-btn" data-tab="plan" onclick="switchTab('plan')">计划</button>
        <button class="tab-btn" data-tab="log" onclick="switchTab('log')">日志</button>
      </div>
      <div class="review-content" id="reviewContent"></div>
      <div class="review-actions">
        <button class="btn-ghost" onclick="copyToClipboard()">复制</button>
        <button class="btn-preview" onclick="previewInNewWindow()">新窗口预览</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="app.js"></script>
</body>
</html>
