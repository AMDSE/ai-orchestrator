<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大狗与耄耋 - B站梗向Galgame</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #00a1d6 0%, #fb7299 100%);
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* 标题页样式 */
        .title-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .game-title {
            font-size: clamp(2rem, 8vw, 4rem);
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
            font-weight: bold;
        }
        .title-btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }
        .game-btn {
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .primary-btn {
            background: #fb7299;
            color: #fff;
        }
        .primary-btn:hover {
            background: #ff85a8;
            transform: translateY(-2px);
        }
        .secondary-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 1px solid #fff;
        }
        .secondary-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        /* 游戏页样式 */
        .game-page {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            position: relative;
        }
        .bg-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .character-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 70%;
            z-index: 1;
        }
        .character-img {
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.2));
        }
        /* 对话框区域 */
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            min-height: 150px;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            padding: 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .character-name {
            font-size: 1.2rem;
            color: #00a1d6;
            font-weight: bold;
        }
        .dialogue-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
            flex-grow: 1;
        }
        /* 选项组 */
        .options-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .option-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #00a1d6;
            background: #fff;
            color: #00a1d6;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background: #00a1d6;
            color: #fff;
        }
        /* 底部菜单 */
        .game-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 3;
        }
        .menu-btn {
            padding: 8px 12px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        /* 存档弹窗 */
        .save-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            width: 90%;
            max-width: 500px;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-title {
            font-size: 1.3rem;
            color: #00a1d6;
            font-weight: bold;
        }
        .save-slot-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .save-slot {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .save-slot:hover {
            border-color: #00a1d6;
            background: rgba(0,161,214,0.05);
        }
        /* 移动端自适应 */
        @media (max-width: 768px) {
            .character-layer {
                height: 50%;
            }
            .dialogue-box {
                width: 95%;
                bottom: 10px;
                min-height: 120px;
                padding: 15px;
            }
            .game-title {
                font-size: 2.5rem;
            }
            .menu-btn {
                padding: 6px 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题页 -->
        <div class="title-page" id="titlePage">
            <h1 class="game-title">大狗与耄耋</h1>
            <div class="title-btn-group">
                <button class="game-btn primary-btn" id="startBtn">开始游戏</button>
                <button class="game-btn secondary-btn" id="loadBtn">读取存档</button>
                <button class="game-btn secondary-btn" id="settingsBtn">游戏设置</button>
            </div>
        </div>

        <!-- 游戏页 -->
        <div class="game-page" id="gamePage">
            <!-- 背景层 -->
            <div class="bg-layer" id="bgLayer"></div>
            <!-- 角色层 -->
            <div class="character-layer" id="characterLayer">
                <img src="" alt="角色立绘" class="character-img" id="characterImg" style="display:none;">
            </div>
            <!-- 游戏菜单 -->
            <div class="game-menu">
                <button class="menu-btn" id="saveBtn">存档</button>
                <button class="menu-btn" id="loadGameBtn">读档</button>
                <button class="menu-btn" id="autoBtn">自动播放</button>
                <button class="menu-btn" id="backTitleBtn">返回标题</button>
            </div>
            <!-- 对话框 -->
            <div class="dialogue-box" id="dialogueBox">
                <div class="character-name" id="characterName"></div>
                <div class="dialogue-content" id="dialogueContent"></div>
                <div class="options-group" id="optionsGroup"></div>
            </div>
        </div>

        <!-- 存档弹窗 -->
        <div class="save-modal" id="saveModal">
            <div class="modal-content">
                <div class="modal-title" id="modalTitle">选择存档位</div>
                <div class="save-slot-group" id="saveSlotGroup"></div>
                <button class="game-btn secondary-btn" id="closeModalBtn">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 剧情数据配置（贴合B站大狗与耄耋梗内容）
        const storyData = [
            {
                id: 0,
                bg: "linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%)",
                character: null,
                name: "",
                content: "那是一个普通的周末下午，我正躺在家里刷B站，突然看到一个视频标题：《当大狗遇到耄耋会发生什么？》",
                options: null,
                next: 1
            },
            {
                id: 1,
                bg: "linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%)",
                character: null,
                name: "",
                content: "出于好奇我点了进去，结果视频刚播放到一半，屏幕突然发出一道耀眼的光芒，我失去了意识...",
                options: null,
                next: 2
            },
            {
                id: 2,
                bg: "linear-gradient(135deg, #FFF8DC 0%, #FFEFD5 100%)",
                character: "https://dummyimage.com/400x800/ff9999/fff&text=大狗立绘",
                name: "？？？",
                content: "喂！醒醒！你终于醒了！我还以为你还要睡多久呢！",
                options: null,
                next: 3
            },
            {
                id: 3,
                bg: "linear-gradient(135deg, #FFF8DC 0%, #FFEFD5 100%)",
                character: "https://dummyimage.com/400x800/ff9999/fff&text=大狗立绘",
                name: "大狗",
                content: "哦对了自我介绍一下，我是大狗，就是你在B站天天看的那个大狗！这里是我的世界，你被选中来陪我玩啦！",
                options: [
                    { text: "啊？我被穿越了？", next: 4 },
                    { text: "那耄耋呢？我想见耄耋！", next: 5 }
                ]
            },
            {
                id: 4,
                bg: "linear-gradient(135deg, #FFF8DC 0%, #FFEFD5 100%)",
                character: "https://dummyimage.com/400x800/ff9999/fff&text=大狗立绘",
                name: "大狗",
                content: "对哦对哦！不过别急，耄耋就在后面呢，它听说有客人来，特意准备了好吃的！走走走我带你去找它！",
                options: null,
                next: 6
            },
            {
                id: 5,
                bg: "linear-gradient(135deg, #FFF8DC 0%, #FFEFD5 100%)",
                character: "https://dummyimage.com/400x800/ff9999/fff&text=大狗立绘",
                name: "大狗",
                content: "哈哈你这么着急见耄耋呀！它就在后面准备小零食呢，走走走我带你去！它看到你肯定特别开心！",
                options: null,
                next: 6
            },
            {
                id: 6,
                bg: "linear-gradient(135deg, #FFE4E1 0%, #FFC0CB 100%)",
                character: "https://dummyimage.com/400x800/99ccff/fff&text=耄耋立绘",
                name: "耄耋",
                content: "你来啦！欢迎欢迎！我准备了你最喜欢的小饼干，还有你常喝的快乐水，快坐快坐！",
                options: null,
                next: 7
            },
            {
                id: 7,
                bg: "linear-gradient(135deg, #FFE4E1 0%, #FFC0CB 100%)",
                character: "https://dummyimage.com/400x800/99ccff/fff&text=耄耋立绘",
                name: "耄耋",
                content: "大狗天天跟我说它想找个朋友一起玩，看来它的愿望实现啦！以后你可以天天来找我们玩哦！",
                options: [
                    { text: "太好了！我以后一定常来！", next: 8 },
                    { text: "那我可以在B站发我们的日常吗？", next: 9 }
                ]
            },
            {
                id: 8,
                bg: "linear-gradient(135deg, #FFE4E1 0%, #FFC0CB 100%)",
                character: "https://dummyimage.com/400x800/99ccff/fff&text=耄耋立绘",
                name: "耄耋",
                content: "好呀好呀！太好了！以后我们就可以一起拍视频，一起整活，肯定能上热门！",
                options: null,
                next: 10
            },
            {
                id: 9,
                bg: "linear-gradient(135deg, #FFE4E1 0%, #FFC0CB 100%)",
                character: "https://dummyimage.com/400x800/99ccff/fff&text=耄耋立绘",
                name: "耄耋",
                content: "当然可以呀！我们本来就天天在B站发视频，你来了正好可以当我们的专属摄影师，肯定能拍很多好玩的素材！",
                options: null,
                next: 10
            },
            {
                id: 10,
                bg: "linear-gradient(135deg, #FFE4E1 0%, #FFC0CB 100%)",
                character: null,
                name: "",
                content: "【恭喜你完成《大狗与耄耋》初回剧情！更多DLC内容敬请期待~】",
                options: null,
                next: null
            }
        ];

        // 游戏状态管理
        let gameState = {
            currentScene: 0,
            isAutoPlay: false,
            autoPlayTimer: null,
            saveSlots: [null, null, null, null, null, null]
        };

        // DOM元素
        const titlePage = document.getElementById('titlePage');
        const gamePage = document.getElementById('gamePage');
        const startBtn = document.getElementById('startBtn');
        const loadBtn = document.getElementById('loadBtn');
        const bgLayer = document.getElementById('bgLayer');
        const characterImg = document.getElementById('characterImg');
        const characterName = document.getElementById('characterName');
        const dialogueContent = document.getElementById('dialogueContent');
        const optionsGroup = document.getElementById('optionsGroup');
        const saveBtn = document.getElementById('saveBtn');
        const loadGameBtn = document.getElementById('loadGameBtn');
        const autoBtn = document.getElementById('autoBtn');
        const backTitleBtn = document.getElementById('backTitleBtn');
        const saveModal = document.getElementById('saveModal');
        const modalTitle = document.getElementById('modalTitle');
        const saveSlotGroup = document.getElementById('saveSlotGroup');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // 初始化存档位
        function initSaveSlots() {
            saveSlotGroup.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const slot = document.createElement('div');
                slot.className = 'save-slot';
                slot.dataset.slot = i;
                slot.textContent = gameState.saveSlots[i] !== null ? `存档${i+1} - 场景${gameState.saveSlots[i] + 1}` : `存档${i+1} - 空`;
                slot.addEventListener('click', () => handleSaveLoad(i));
                saveSlotGroup.appendChild(slot);
            }
        }

        // 处理存档/读档
        function handleSaveLoad(slotIndex) {
            if (modalTitle.textContent === '选择存档位') {
                gameState.saveSlots[slotIndex] = gameState.currentScene;
                localStorage.setItem('dogAndCatSave', JSON.stringify(gameState.saveSlots));
                alert(`存档${slotIndex+1}保存成功！`);
            } else {
                if (gameState.saveSlots[slotIndex] !== null) {
                    gameState.currentScene = gameState.saveSlots[slotIndex];
                    renderScene();
                    alert(`存档${slotIndex+1}读取成功！`);
                } else {
                    alert('该存档位为空！');
                }
            }
            saveModal.style.display = 'none';
            initSaveSlots();
        }

        // 渲染场景
        function renderScene() {
            const scene = storyData[gameState.currentScene];
            bgLayer.style.background = scene.bg;
            if (scene.character) {
                characterImg.src = scene.character;
                characterImg.style.display = 'block';
            } else {
                characterImg.style.display = 'none';
            }
            characterName.textContent = scene.name || '';
            dialogueContent.textContent = scene.content;
            optionsGroup.innerHTML = '';
            if (scene.options && scene.options.length > 0) {
                optionsGroup.style.display = 'flex';
                scene.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option.text;
                    btn.addEventListener('click', () => {
                        gameState.currentScene = option.next;
                        renderScene();
                    });
                    optionsGroup.appendChild(btn);
                });
            } else {
                optionsGroup.style.display = 'none';
                dialogueContent.parentElement.onclick = () => {
                    if (scene.next !== null) {
                        gameState.currentScene = scene.next;
                        renderScene();
                    }
                };
            }
        }

        // 自动播放
        function toggleAutoPlay() {
            gameState.isAutoPlay = !gameState.isAutoPlay;
            autoBtn.textContent = gameState.isAutoPlay ? '停止自动' : '自动播放';
            if (gameState.isAutoPlay) {
                gameState.autoPlayTimer = setInterval(() => {
                    const scene = storyData[gameState.currentScene];
                    if (scene.next !== null && !scene.options) {
                        gameState.currentScene = scene.next;
                        renderScene();
                    } else {
                        clearInterval(gameState.autoPlayTimer);
                        gameState.isAutoPlay = false;
                        autoBtn.textContent = '自动播放';
                    }
                }, 2000);
            } else {
                clearInterval(gameState.autoPlayTimer);
            }
        }

        // 返回标题
        function backToTitle() {
            gamePage.style.display = 'none';
            titlePage.style.display = 'flex';
            if (gameState.isAutoPlay) toggleAutoPlay();
        }

        // 事件监听
        startBtn.addEventListener('click', () => {
            titlePage.style.display = 'none';
            gamePage.style.display = 'flex';
            gameState.currentScene = 0;
            renderScene();
        });

        loadBtn.addEventListener('click', () => {
            modalTitle.textContent = '选择读档位';
            saveModal.style.display = 'flex';
            initSaveSlots();
        });

        saveBtn.addEventListener('click', () => {
            modalTitle.textContent = '选择存档位';
            saveModal.style.display = 'flex';
            initSaveSlots();
        });

        loadGameBtn.addEventListener('click', () => {
            modalTitle.textContent = '选择读档位';
            saveModal.style.display = 'flex';
            initSaveSlots();
        });

        autoBtn.addEventListener('click', toggleAutoPlay);
        backTitleBtn.addEventListener('click', backToTitle);
        closeModalBtn.addEventListener('click', () => {
            saveModal.style.display = 'none';
        });

        // 初始化读取本地存档
        const savedData = localStorage.getItem('dogAndCatSave');
        if (savedData) {
            gameState.saveSlots = JSON.parse(savedData);
        }
    </script>
</body>
</html>
