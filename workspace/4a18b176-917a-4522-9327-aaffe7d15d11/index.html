<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026热梗互动玩具</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #00aeec;
      --bg-color: #f5f7fa;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-color: #333;
      --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: var(--text-color);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      font-size: 2rem;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .ws-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .ws-status.connected {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }

    .ws-status.disconnected {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .login-btn, .share-btn {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .login-btn:hover, .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 174, 236, 0.4);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 15px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
    }

    .memes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .meme-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
    }

    .meme-card:active {
      transform: scale(0.98);
    }

    .meme-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .meme-name {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--text-color);
    }

    .meme-desc {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .meme-count {
      font-size: 0.9rem;
      color: var(--primary-color);
      font-weight: 600;
    }

    .click-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(0, 174, 236, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .meme-card:active .click-effect {
      width: 300px;
      height: 300px;
    }

    .danmu-container {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      height: 80vh;
      position: sticky;
      top: 20px;
    }

    .danmu-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      scroll-behavior: smooth;
    }

    .danmu-item {
      padding: 8px 12px;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      animation: slideIn 0.3s ease;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .danmu-me {
      background: rgba(0, 174, 236, 0.15);
      border-left: 3px solid var(--primary-color);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .danmu-user {
      font-weight: 600;
      color: var(--primary-color);
    }

    .danmu-input {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    .danmu-input input {
      flex: 1;
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .danmu-input input:focus {
      background: white;
      box-shadow: 0 0 0 2px var(--primary-color);
    }

    .danmu-input button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .danmu-input button:hover {
      background: #0098d4;
    }

    .meme-effect {
      position: fixed;
      font-size: 5rem;
      pointer-events: none;
      animation: floatUp 1s ease forwards;
      z-index: 1000;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-200px) scale(1.5);
      }
    }

    /* 移动端适配 */
    @media (max-width: 768px) {
      #app {
        padding: 10px;
      }

      .header {
        padding: 15px;
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .danmu-container {
        position: relative;
        top: 0;
        height: 40vh;
        order: -1;
      }

      .memes-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
      }

      .meme-card {
        padding: 15px;
      }

      .meme-icon {
        font-size: 3rem;
      }

      .meme-name {
        font-size: 1.1rem;
      }

      .meme-desc {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.2rem;
      }

      .status-bar {
        gap: 10px;
      }

      .ws-status {
        padding: 6px 12px;
        font-size: 0.8rem;
      }

      .login-btn, .share-btn {
        padding: 6px 15px;
        font-size: 0.8rem;
      }

      .memes-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .meme-card {
        padding: 12px;
      }

      .meme-icon {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>2026热梗互动玩具</h1>
      <div class="status-bar">
        <span class="ws-status" :class="wsStatus">
          <i class="status-dot"></i>
          {{ wsStatus === 'connected' ? '弹幕连接中' : '连接断开' }}
        </span>
        <button v-if="!user.isLogin" @click="bilibiliLogin" class="login-btn">B站登录</button>
        <div v-else class="user-info">
          <img :src="user.avatar" class="avatar" alt="头像">
          <span>{{ user.name }}</span>
          <button @click="bilibiliShare" class="share-btn">分享</button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="memes-grid">
        <div v-for="meme in hotMemes" :key="meme.id" class="meme-card" @click="handleMemeClick(meme)">
          <div class="meme-icon">{{ meme.icon }}</div>
          <h3 class="meme-name">{{ meme.name }}</h3>
          <p class="meme-desc">{{ meme.desc }}</p>
          <div class="meme-count">点赞：{{ meme.count }}</div>
          <div class="click-effect"></div>
        </div>
      </section>

      <section class="danmu-container">
        <div class="danmu-list">
          <div v-for="(danmu, index) in danmus" :key="index" class="danmu-item" :class="{ 'danmu-me': danmu.isMe }" :style="{ color: danmu.color }">
            <span class="danmu-user">{{ danmu.user }}：</span>
            <span class="danmu-content">{{ danmu.content }}</span>
          </div>
        </div>
        <div class="danmu-input">
          <input type="text" v-model="danmuInput" placeholder="发送弹幕..." @keyup.enter="sendDanmu(danmuInput); danmuInput = ''">
          <button @click="sendDanmu(danmuInput); danmuInput = ''">发送</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const { createApp, reactive, onMounted, ref } = Vue;

    createApp({
      setup() {
        const danmuInput = ref('');
        
        const state = reactive({
          hotMemes: [
            { id: 1, name: '量子摸鱼', icon: '🐟', desc: '量子态摸鱼，老板看不到，你在摸鱼又在工作', count: 0 },
            { id: 2, name: '赛博功德', icon: '🙏', desc: '电子木鱼，赛博超度，敲一下加一点功德', count: 0 },
            { id: 3, name: '恐龙扛狼', icon: '🦖', desc: '恐龙扛狼，东北神兽，扛狼扛狼扛扛狼', count: 0 },
            { id: 4, name: 'AI算命', icon: '🤖', desc: 'AI算卦，科学迷信，输入生辰八字算运势', count: 0 },
            { id: 5, name: '元宇宙种菜', icon: '🌱', desc: '虚拟种菜，现实躺平，我的菜园我最大', count: 0 },
            { id: 6, name: '电子黄牛', icon: '🐂', desc: '自动抢票，赛博黄牛，抢不到票找我', count: 0 }
          ],
          danmus: [],
          user: {
            isLogin: false,
            name: '游客',
            avatar: ''
          },
          wsStatus: 'disconnected',
          ws: null,
          heartbeatTimer: null,
          reconnectTimer: null
        });

        const connectWebSocket = () => {
          if (state.wsStatus === 'connecting' || state.wsStatus === 'connected') return;
          state.wsStatus = 'connecting';
          try {
            // 注意：B站弹幕真实地址为 wss://broadcastlv.chat.bilibili.com:2244/sub
            // 这里使用模拟WebSocket服务，实际部署时替换为真实地址
            state.ws = new WebSocket('wss://echo.websocket.events');
            
            state.ws.onopen = () => {
              state.wsStatus = 'connected';
              startHeartbeat();
              // 模拟发送加入房间包
              console.log('WebSocket连接成功，模拟加入B站弹幕房间');
              // 模拟接收弹幕
              setInterval(() => {
                const mockDanmus = [
                  '哈哈哈哈，这个梗笑死我了',
                  '2026年最新热梗，前排围观',
                  '量子摸鱼，老板永远发现不了',
                  '赛博功德+1',
                  '恐龙扛狼太好笑了',
                  'AI算命说我今年能暴富',
                  '元宇宙种菜，我的菜地最棒',
                  '电子黄牛帮我抢到票了'
                ];
                const mockUser = '用户' + Math.floor(Math.random() * 10000);
                const mockContent = mockDanmus[Math.floor(Math.random() * mockDanmus.length)];
                handleDanmu({
                  user: mockUser,
                  content: mockContent,
                  color: '#'+Math.floor(Math.random()*16777215).toString(16)
                });
              }, 2000);
            };
            
            state.ws.onmessage = (e) => {
              // 真实环境解析B站弹幕协议
              // 这里模拟弹幕数据
              console.log('收到消息：', e.data);
            };
            
            state.ws.onclose = () => {
              state.wsStatus = 'disconnected';
              stopHeartbeat();
              reconnect();
            };
            
            state.ws.onerror = () => {
              state.ws.close();
            };
          } catch (e) {
            console.error('WebSocket连接失败：', e);
            state.wsStatus = 'disconnected';
            reconnect();
          }
        };

        const startHeartbeat = () => {
          state.heartbeatTimer = setInterval(() => {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
              // B站心跳包为26字节空数据
              state.ws.send(new ArrayBuffer(26));
            }
          }, 30000);
        };

        const stopHeartbeat = () => {
          if (state.heartbeatTimer) {
            clearInterval(state.heartbeatTimer);
            state.heartbeatTimer = null;
          }
        };

        const reconnect = () => {
          if (state.reconnectTimer) return;
          state.reconnectTimer = setTimeout(() => {
            state.reconnectTimer = null;
            connectWebSocket();
          }, 3000);
        };

        const handleDanmu = (danmu) => {
          state.danmus.push({
            ...danmu,
            time: Date.now(),
            isMe: danmu.user === state.user.name
          });
          if (state.danmus.length > 50) {
            state.danmus.shift();
          }
          // 自动滚动到底部
          setTimeout(() => {
            const danmuList = document.querySelector('.danmu-list');
            if (danmuList) {
              danmuList.scrollTop = danmuList.scrollHeight;
            }
          }, 50);
        };

        const sendDanmu = (content) => {
          if (!content.trim()) return;
          if (state.wsStatus === 'connected') {
            // 真实环境发送弹幕到B站服务器
            state.ws.send(JSON.stringify({
              type: 'danmu',
              content: content,
              user: state.user.name
            }));
          }
          // 添加到本地弹幕
          handleDanmu({
            user: state.user.name,
            content: content,
            color: '#00aeec'
          });
        };

        const handleMemeClick = (meme) => {
          meme.count++;
          triggerEffect(meme);
          sendDanmu(`给【${meme.name}】点赞！当前点赞数：${meme.count}`);
        };

        const triggerEffect = (meme) => {
          const effect = document.createElement('div');
          effect.className = 'meme-effect';
          effect.textContent = meme.icon;
          effect.style.left = Math.random() * 80 + 10 + '%';
          effect.style.top = Math.random() * 60 + 20 + '%';
          document.body.appendChild(effect);
          setTimeout(() => {
            effect.remove();
          }, 1000);
        };

        const bilibiliLogin = () => {
          // 真实环境调用B站登录SDK
          // 这里模拟登录成功
          state.user.isLogin = true;
          state.user.name = 'B站用户' + Math.floor(Math.random() * 10000);
          state.user.avatar = 'https://picsum.photos/50/50?random=' + Math.random();
          sendDanmu('大家好，我是' + state.user.name + '，来了来了！');
        };

        const bilibiliShare = () => {
          // 真实环境调用B站分享SDK
          alert('分享功能需要接入B站开放平台SDK，这里模拟分享成功！');
        };

        onMounted(() => {
          connectWebSocket();
        });

        return {
          ...state,
          danmuInput,
          connectWebSocket,
          sendDanmu,
          handleMemeClick,
          bilibiliLogin,
          bilibiliShare
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
