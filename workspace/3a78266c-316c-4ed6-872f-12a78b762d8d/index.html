<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《大狗与耄耋》B站2026梗Galgame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bili-blue: #00a1d6;
            --bili-pink: #fb7299;
            --bg-dark: #18191c;
            --bg-light: #f4f5f7;
            --text-primary: #f1f2f3;
            --text-secondary: #c9ccd0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 主容器 */
        .game-container {
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* 开场界面 */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .game-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--bili-blue), var(--bili-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-align: center;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            text-align: center;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 8px;
        }

        .btn-primary {
            background: var(--bili-blue);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 161, 214, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--bili-blue);
            border: 2px solid var(--bili-blue);
        }

        .btn-secondary:hover {
            background: rgba(0, 161, 214, 0.1);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .login-status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bili-blue);
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            background-size: cover;
            background-position: center;
        }

        /* 游戏主界面 */
        .game-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        /* 顶部菜单栏 */
        .top-bar {
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 立绘区域 */
        .character-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 20px;
            background: linear-gradient(180deg, #2a3a4a 0%, #1a2a3a 100%);
        }

        .character {
            max-height: 80%;
            max-width: 40%;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
        }

        /* 弹幕区域 */
        .danmaku-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            pointer-events: none;
            overflow: hidden;
        }

        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            color: white;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            animation: danmaku-flow 8s linear forwards;
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes danmaku-flow {
            from {
                transform: translateX(100vw);
            }
            to {
                transform: translateX(-100%);
            }
        }

        /* 对话框区域 */
        .dialogue-box {
            height: 240px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-top: 2px solid var(--bili-blue);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 60;
        }

        .speaker-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--bili-blue);
            margin-bottom: 8px;
        }

        .dialogue-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-primary);
            flex: 1;
            overflow-y: auto;
        }

        .dialogue-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            padding: 10px 20px;
            background: rgba(0, 161, 214, 0.2);
            border: 1px solid var(--bili-blue);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            background: var(--bili-blue);
            transform: translateY(-1px);
        }

        /* 设置面板 */
        .settings-panel {
            position: absolute;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background: rgba(20, 20, 25, 0.95);
            backdrop-filter: blur(15px);
            z-index: 200;
            transition: right 0.3s ease;
            padding: 30px 20px;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }

        .settings-panel.active {
            right: 0;
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--bili-blue);
        }

        .setting-item {
            margin-bottom: 25px;
        }

        .setting-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--bili-blue);
            border-radius: 50%;
            cursor: pointer;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .switch.active {
            background: var(--bili-blue);
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: left 0.3s;
        }

        .switch.active::after {
            left: 27px;
        }

        /* 存档面板 */
        .save-panel {
            position: absolute;
            top: 0;
            left: -350px;
            width: 350px;
            height: 100%;
            background: rgba(20, 20, 25, 0.95);
            backdrop-filter: blur(15px);
            z-index: 200;
            transition: left 0.3s ease;
            padding: 30px 20px;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
        }

        .save-panel.active {
            left: 0;
        }

        .save-slots {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .save-slot {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .save-slot:hover {
            background: rgba(0, 161, 214, 0.1);
            border-color: var(--bili-blue);
        }

        .slot-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .slot-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 遮罩层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            display: block;
            opacity: 1;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .game-title {
                font-size: 2rem;
            }

            .game-subtitle {
                font-size: 1rem;
                margin-bottom: 2rem;
            }

            .btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }

            .top-bar {
                height: 50px;
                padding: 0 12px;
            }

            .character {
                max-width: 70%;
            }

            .dialogue-box {
                height: 200px;
                padding: 15px;
            }

            .speaker-name {
                font-size: 1rem;
            }

            .dialogue-text {
                font-size: 0.95rem;
            }

            .option-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
                width: 100%;
            }

            .dialogue-options {
                flex-direction: column;
                gap: 8px;
            }

            .settings-panel, .save-panel {
                width: 100%;
                right: -100%;
                left: -100%;
            }

            .settings-panel.active {
                right: 0;
            }

            .save-panel.active {
                left: 0;
            }

            .danmaku-item {
                font-size: 0.9rem;
            }

            .login-status {
                top: 10px;
                right: 10px;
                font-size: 0.8rem;
            }

            .user-avatar {
                width: 28px;
                height: 28px;
            }
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 开场界面 -->
        <div class="start-screen" id="startScreen">
            <div class="login-status" id="loginStatus">
                未登录B站账号
            </div>
            <h1 class="game-title">《大狗与耄耋》</h1>
            <p class="game-subtitle">B站2026年度爆笑梗王Galgame</p>
            <div class="btn-group">
                <button class="btn btn-primary" id="loginBtn">B站账号登录</button>
                <button class="btn btn-secondary" id="startBtn" disabled>开始游戏</button>
                <button class="btn btn-secondary" id="continueBtn">继续游戏</button>
                <button class="btn btn-secondary" id="settingsBtn">游戏设置</button>
            </div>
        </div>

        <!-- 游戏主界面 -->
        <div class="game-screen" id="gameScreen">
            <div class="top-bar">
                <button class="menu-btn" id="menuBtn">☰</button>
                <div style="display: flex; gap: 12px;">
                    <button class="menu-btn" id="saveBtn">💾 存档</button>
                    <button class="menu-btn" id="loadBtn">📂 读档</button>
                    <button class="menu-btn" id="autoBtn">▶ 自动</button>
                    <button class="menu-btn" id="settingsBtn2">⚙ 设置</button>
                </div>
            </div>

            <div class="character-area">
                <div class="danmaku-area" id="danmakuArea"></div>
                <img src="" alt="角色立绘" class="character" id="characterSprite" style="display: none;">
            </div>

            <div class="dialogue-box">
                <div class="speaker-name" id="speakerName"></div>
                <div class="dialogue-text" id="dialogueText"></div>
                <div class="dialogue-options" id="dialogueOptions"></div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div class="settings-panel" id="settingsPanel">
            <h2 class="panel-title">游戏设置</h2>
            <div class="setting-item">
                <label class="setting-label">背景音乐音量</label>
                <input type="range" class="slider" id="bgmVolume" min="0" max="100" value="50">
            </div>
            <div class="setting-item">
                <label class="setting-label">音效音量</label>
                <input type="range" class="slider" id="sfxVolume" min="0" max="100" value="70">
            </div>
            <div class="setting-item">
                <div class="toggle-switch">
                    <label class="setting-label">弹幕显示</label>
                    <div class="switch active" id="danmakuToggle"></div>
                </div>
            </div>
            <div class="setting-item">
                <div class="toggle-switch">
                    <label class="setting-label">自动播放</label>
                    <div class="switch" id="autoPlayToggle"></div>
                </div>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 30px;" id="closeSettings">关闭</button>
        </div>

        <!-- 存档面板 -->
        <div class="save-panel" id="savePanel">
            <h2 class="panel-title">存档管理</h2>
            <div class="save-slots" id="saveSlots">
                <!-- 存档槽位动态生成 -->
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 30px;" id="closeSave">关闭</button>
        </div>

        <!-- 遮罩层 -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script>
        // 模拟B站SDK
        window.biliSDK = {
            isLogin: false,
            userInfo: null,
            
            // 模拟登录
            login: () => {
                return new Promise((resolve) => {
                    setTimeout(() => {
                        window.biliSDK.isLogin = true;
                        window.biliSDK.userInfo = {
                            uid: 'bili_' + Math.floor(Math.random() * 1000000),
                            name: 'B站用户' + Math.floor(Math.random() * 10000),
                            avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${Math.random()}`
                        };
                        resolve(window.biliSDK.userInfo);
                    }, 800);
                });
            },

            // 获取用户信息
            getUserInfo: () => {
                return window.biliSDK.userInfo;
            },

            // 发送弹幕
            sendDanmaku: (text) => {
                if (!window.biliSDK.isLogin) {
                    alert('请先登录B站账号');
                    return false;
                }
                // 模拟弹幕发送
                console.log(`弹幕已发送: ${text}`);
                return true;
            },

            // 分享游戏
            share: () => {
                if (!window.biliSDK.isLogin) {
                    alert('请先登录B站账号');
                    return false;
                }
                // 模拟分享
                console.log('游戏已分享到B站动态');
                alert('已成功分享到B站动态！');
                return true;
            }
        };

        // 游戏引擎
        const GameEngine = {
            currentScene: 0,
            dialogueIndex: 0,
            isAutoPlay: false,
            autoPlayTimer: null,
            settings: {
                bgmVolume: 50,
                sfxVolume: 70,
                showDanmaku: true,
                autoPlay: false
            },
            saves: [],
            
            // 剧情数据
            scenes: [
                {
                    id: 0,
                    speaker: '旁白',
                    text: '2026年，B站年度梗王评选现场，两位传奇选手即将登场...',
                    character: null,
                    options: null,
                    next: 1
                },
                {
                    id: 1,
                    speaker: '主持人',
                    text: '首先登场的是，全网最会整活的UP主——大狗！',
                    character: 'dog.png',
                    options: null,
                    next: 2
                },
                {
                    id: 2,
                    speaker: '大狗',
                    text: '大家好！我是大狗！今天我要用我的魔性舞步征服全场！',
                    character: 'dog.png',
                    options: [
                        { text: '加油大狗！', next: 3 },
                        { text: '这舞步太抽象了', next: 4 }
                    ]
                },
                {
                    id: 3,
                    speaker: '大狗',
                    text: '谢谢兄弟们的支持！看我的终极必杀技——狗刨式街舞！',
                    character: 'dog.png',
                    options: null,
                    next: 5
                },
                {
                    id: 4,
                    speaker: '大狗',
                    text: '抽象？这叫艺术！你懂不懂啊！看我的超绝机械舞！',
                    character: 'dog.png',
                    options: null,
                    next: 5
                },
                {
                    id: 5,
                    speaker: '旁白',
                    text: '接下来登场的是，B站元老级UP主，全网最长寿的创作者——耄耋！',
                    character: null,
                    options: null,
                    next: 6
                },
                {
                    id: 6,
                    speaker: '耄耋',
                    text: '咳咳，大家好，我是耄耋。虽然我年纪大了，但我的创作热情依然不减！',
                    character: 'cat.png',
                    options: [
                        { text: '耄耋老师加油！', next: 7 },
                        { text: '您老注意身体啊', next: 8 }
                    ]
                },
                {
                    id: 7,
                    speaker: '耄耋',
                    text: '谢谢年轻人，今天我要展示我的最新作品——用算盘剪辑的鬼畜视频！',
                    character: 'cat.png',
                    options: null,
                    next: 9
                },
                {
                    id: 8,
                    speaker: '耄耋',
                    text: '放心，我每天坚持锻炼，还能再创作50年！看我用毛笔写的代码！',
                    character: 'cat.png',
                    options: null,
                    next: 9
                },
                {
                    id: 9,
                    speaker: '旁白',
                    text: '两位选手的展示精彩纷呈，究竟谁能获得今年的梗王称号呢？',
                    character: null,
                    options: [
                        { text: '大狗必胜！', next: 10 },
                        { text: '耄耋老师才是真神！', next: 11 },
                        { text: '我全都要！', next: 12 }
                    ]
                },
                {
                    id: 10,
                    speaker: '大狗',
                    text: '哈哈，梗王归我啦！今晚开香槟庆祝！',
                    character: 'dog.png',
                    options: null,
                    next: 13
                },
                {
                    id: 11,
                    speaker: '耄耋',
                    text: '承让承让，今晚我请大家喝茶！',
                    character: 'cat.png',
                    options: null,
                    next: 13
                },
                {
                    id: 12,
                    speaker: '旁白',
                    text: '最终，评委决定打破惯例，两人同时获得梗王称号！这就是2026年最经典的友情名场面！',
                    character: null,
                    options: null,
                    next: 13
                },
                {
                    id: 13,
                    speaker: '旁白',
                    text: '游戏感谢游玩！点击重新开始按钮再次体验！',
                    character: null,
                    options: null,
                    next: -1
                }
            ],

            // 初始化游戏
            init: () => {
                GameEngine.loadSettings();
                GameEngine.loadSaves();
                GameEngine.bindEvents();
                GameEngine.updateLoginStatus();
                
                // 检查是否有存档
                if (GameEngine.saves.length > 0) {
                    document.getElementById('continueBtn').disabled = false;
                }
            },

            // 绑定事件
            bindEvents: () => {
                // 登录按钮
                document.getElementById('loginBtn').addEventListener('click', async () => {
                    const userInfo = await window.biliSDK.login();
                    GameEngine.updateLoginStatus();
                    document.getElementById('startBtn').disabled = false;
                    alert(`登录成功！欢迎 ${userInfo.name}`);
                });

                // 开始游戏
                document.getElementById('startBtn').addEventListener('click', () => {
                    if (!window.biliSDK.isLogin) {
                        alert('请先登录B站账号');
                        return;
                    }
                    GameEngine.startGame();
                });

                // 继续游戏
                document.getElementById('continueBtn').addEventListener('click', () => {
                    if (GameEngine.saves.length > 0) {
                        const latestSave = GameEngine.saves[GameEngine.saves.length - 1];
                        GameEngine.loadSave(latestSave);
                    }
                });

                // 设置按钮
                document.getElementById('settingsBtn').addEventListener('click', () => {
                    GameEngine.openSettings();
                });

                document.getElementById('settingsBtn2').addEventListener('click', () => {
                    GameEngine.openSettings();
                });

                document.getElementById('closeSettings').addEventListener('click', () => {
                    GameEngine.closeSettings();
                });

                // 存档按钮
                document.getElementById('saveBtn').addEventListener('click', () => {
                    GameEngine.openSavePanel();
                });

                document.getElementById('loadBtn').addEventListener('click', () => {
                    GameEngine.openSavePanel();
                });

                document.getElementById('closeSave').addEventListener('click', () => {
                    GameEngine.closeSavePanel();
                });

                // 自动播放
                document.getElementById('autoBtn').addEventListener('click', () => {
                    GameEngine.toggleAutoPlay();
                });

                // 对话框点击继续
                document.querySelector('.dialogue-box').addEventListener('click', (e) => {
                    if (!e.target.closest('.option-btn')) {
                        GameEngine.nextDialogue();
                    }
                });

                // 设置项
                document.getElementById('bgmVolume').addEventListener('input', (e) => {
                    GameEngine.settings.bgmVolume = e.target.value;
                    GameEngine.saveSettings();
                });

                document.getElementById('sfxVolume').addEventListener('input', (e) => {
                    GameEngine.settings.sfxVolume = e.target.value;
                    GameEngine.saveSettings();
                });

                document.getElementById('danmakuToggle').addEventListener('click', () => {
                    GameEngine.settings.showDanmaku = !GameEngine.settings.showDanmaku;
                    document.getElementById('danmakuToggle').classList.toggle('active', GameEngine.settings.showDanmaku);
                    GameEngine.saveSettings();
                });

                document.getElementById('autoPlayToggle').addEventListener('click', () => {
                    GameEngine.settings.autoPlay = !GameEngine.settings.autoPlay;
                    document.getElementById('autoPlayToggle').classList.toggle('active', GameEngine.settings.autoPlay);
                    GameEngine.toggleAutoPlay();
                    GameEngine.saveSettings();
                });

                // 遮罩层点击关闭面板
                document.getElementById('overlay').addEventListener('click', () => {
                    GameEngine.closeSettings();
                    GameEngine.closeSavePanel();
                });
            },

            // 更新登录状态显示
            updateLoginStatus: () => {
                const loginStatus = document.getElementById('loginStatus');
                if (window.biliSDK.isLogin) {
                    const user = window.biliSDK.getUserInfo();
                    loginStatus.innerHTML = `已登录: ${user.name} <div class="user-avatar" style="background-image: url('${user.avatar}')"></div>`;
                } else {
                    loginStatus.innerHTML = '未登录B站账号';
                }
            },

            // 开始游戏
            startGame: () => {
                document.getElementById('startScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('startScreen').style.display = 'none';
                    document.getElementById('gameScreen').style.display = 'flex';
                    GameEngine.currentScene = 0;
                    GameEngine.dialogueIndex = 0;
                    GameEngine.showDialogue();
                }, 500);
            },

            // 显示对话
            showDialogue: () => {
                const scene = GameEngine.scenes[GameEngine.currentScene];
                if (!scene) return;

                // 更新角色立绘
                const characterSprite = document.getElementById('characterSprite');
                if (scene.character) {
                    characterSprite.src = scene.character;
                    characterSprite.style.display = 'block';
                    characterSprite.classList.add('fade-in');
                } else {
                    characterSprite.style.display = 'none';
                }

                // 更新说话人
                document.getElementById('speakerName').textContent = scene.speaker || '';

                // 更新对话文本
                const dialogueText = document.getElementById('dialogueText');
                dialogueText.textContent = scene.text;
                dialogueText.classList.add('fade-in');

                // 更新选项
                const optionsContainer = document.getElementById('dialogueOptions');
                optionsContainer.innerHTML = '';
                if (scene.options && scene.options.length > 0) {
                    scene.options.forEach(option => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        btn.textContent = option.text;
                        btn.addEventListener('click', () => {
                            GameEngine.currentScene = option.next;
                            GameEngine.showDialogue();
                        });
                        optionsContainer.appendChild(btn);
                    });
                }

                // 添加弹幕效果
                if (GameEngine.settings.showDanmaku && Math.random() > 0.6) {
                    GameEngine.addDanmaku(scene.text.length > 20 ? scene.text.substring(0, 20) + '...' : scene.text);
                }

                // 自动播放
                if (GameEngine.settings.autoPlay) {
                    GameEngine.autoPlayTimer = setTimeout(() => {
                        GameEngine.nextDialogue();
                    }, 3000);
                }
            },

            // 下一段对话
            nextDialogue: () => {
                const scene = GameEngine.scenes[GameEngine.currentScene];
                if (!scene) return;

                if (scene.options && scene.options.length > 0) {
                    return; // 有选项时不自动继续
                }

                if (scene.next === -1) {
                    // 游戏结束
                    if (confirm('游戏结束！是否重新开始？')) {
                        GameEngine.currentScene = 0;
                        GameEngine.showDialogue();
                    }
                    return;
                }

                GameEngine.currentScene = scene.next;
                GameEngine.showDialogue();
            },

            // 添加弹幕
            addDanmaku: (text) => {
                const danmakuArea = document.getElementById('danmakuArea');
                const danmaku = document.createElement('div');
                danmaku.className = 'danmaku-item';
                danmaku.textContent = text;
                danmaku.style.top = Math.random() * 60 + '%';
                danmaku.style.animationDuration = (6 + Math.random() * 4) + 's';
                danmakuArea.appendChild(danmaku);

                // 弹幕动画结束后移除
                setTimeout(() => {
                    danmaku.remove();
                }, 10000);
            },

            // 切换自动播放
            toggleAutoPlay: () => {
                if (GameEngine.settings.autoPlay) {
                    document.getElementById('autoBtn').textContent = '⏸ 暂停';
                    GameEngine.nextDialogue();
                } else {
                    document.getElementById('autoBtn').textContent = '▶ 自动';
                    clearTimeout(GameEngine.autoPlayTimer);
                }
            },

            // 打开设置面板
            openSettings: () => {
                document.getElementById('settingsPanel').classList.add('active');
                document.getElementById('overlay').classList.add('active');
            },

            // 关闭设置面板
            closeSettings: () => {
                document.getElementById('settingsPanel').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            },

            // 打开存档面板
            openSavePanel: () => {
                GameEngine.renderSaveSlots();
                document.getElementById('savePanel').classList.add('active');
                document.getElementById('overlay').classList.add('active');
            },

            // 关闭存档面板
            closeSavePanel: () => {
                document.getElementById('savePanel').classList.remove('active');
                document.getElementById('overlay').classList.remove('active');
            },

            // 渲染存档槽位
            renderSaveSlots: () => {
                const saveSlots = document.getElementById('saveSlots');
                saveSlots.innerHTML = '';
                
                // 添加新存档按钮
                const newSaveBtn = document.createElement('div');
                newSaveBtn.className = 'save-slot';
                newSaveBtn.innerHTML = '<div class="slot-title">➕ 新建存档</div><div class="slot-time">点击保存当前进度</div>';
                newSaveBtn.addEventListener('click', () => {
                    GameEngine.createSave();
                });
                saveSlots.appendChild(newSaveBtn);

                // 显示已有存档
                GameEngine.saves.forEach((save, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'save-slot';
                    slot.innerHTML = `
                        <div class="slot-title">存档 ${index + 1}</div>
                        <div class="slot-time">进度: ${save.sceneName} | 保存时间: ${save.time}</div>
                    `;
                    slot.addEventListener('click', () => {
                        GameEngine.loadSave(save);
                    });
                    saveSlots.appendChild(slot);
                });
            },

            // 创建存档
            createSave: () => {
                const scene = GameEngine.scenes[GameEngine.currentScene];
                const save = {
                    id: Date.now(),
                    sceneId: GameEngine.currentScene,
                    sceneName: scene.speaker + ': ' + scene.text.substring(0, 15) + '...',
                    time: new Date().toLocaleString(),
                    data: {
                        currentScene: GameEngine.currentScene,
                        dialogueIndex: GameEngine.dialogueIndex
                    }
                };
                
                GameEngine.saves.push(save);
                GameEngine.saveSaves();
                GameEngine.renderSaveSlots();
                alert('存档成功！');
            },

            // 加载存档
            loadSave: (save) => {
                GameEngine.currentScene = save.data.currentScene;
                GameEngine.dialogueIndex = save.data.dialogueIndex;
                GameEngine.closeSavePanel();
                GameEngine.showDialogue();
            },

            // 保存设置到localStorage
            saveSettings: () => {
                localStorage.setItem('gameSettings', JSON.stringify(GameEngine.settings));
            },

            // 加载设置
            loadSettings: () => {
                const saved = localStorage.getItem('gameSettings');
                if (saved) {
                    GameEngine.settings = JSON.parse(saved);
                    document.getElementById('bgmVolume').value = GameEngine.settings.bgmVolume;
                    document.getElementById('sfxVolume').value = GameEngine.settings.sfxVolume;
                    document.getElementById('danmakuToggle').classList.toggle('active', GameEngine.settings.showDanmaku);
                    document.getElementById('autoPlayToggle').classList.toggle('active', GameEngine.settings.autoPlay);
                }
            },

            // 保存存档到localStorage
            saveSaves: () => {
                localStorage.setItem('gameSaves', JSON.stringify(GameEngine.saves));
            },

            // 加载存档
            loadSaves: () => {
                const saved = localStorage.getItem('gameSaves');
                if (saved) {
                    GameEngine.saves = JSON.parse(saved);
                }
            }
        };

        // 初始化游戏
        window.addEventListener('load', () => {
            GameEngine.init();
        });
    </script>
</body>
</html>
