<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎮 电子发疯模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bili-pink:#fb7299;
  --bili-blue:#00a1d6;
  --bili-dark:#18191c;
  --bili-card:#252627;
  --bili-text:#e1e3e5;
  --crazy-1:#ff6b6b;--crazy-2:#ffd93d;--crazy-3:#6bcb77;
  --crazy-4:#4d96ff;--crazy-5:#ff6bcf;--crazy-6:#a855f7;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bili-dark);color:var(--bili-text);}
canvas{display:block;}

/* ===== 入口页 ===== */
#entry-screen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  transition:opacity .6s,transform .6s;
}
#entry-screen.hidden{opacity:0;pointer-events:none;transform:scale(1.1);}
.entry-title{
  font-size:clamp(2rem,6vw,3.5rem);font-weight:900;
  background:linear-gradient(90deg,var(--crazy-1),var(--crazy-5),var(--crazy-4),var(--crazy-2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:titlePulse 2s ease-in-out infinite;text-align:center;
}
@keyframes titlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.entry-subtitle{font-size:clamp(.9rem,2.5vw,1.2rem);margin:.8rem 0 2rem;opacity:.8;text-align:center;max-width:90%;}
.entry-visual{
  width:clamp(120px,30vw,200px);height:clamp(120px,30vw,200px);
  border-radius:50%;position:relative;margin-bottom:2rem;
  animation:entryFloat 3s ease-in-out infinite;
}
@keyframes entryFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(10deg)}}
.entry-visual .face{
  width:100%;height:100%;border-radius:50%;
  background:linear-gradient(135deg,#fb7299,#ff6b6b);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 60px rgba(251,114,153,.5);
}
.entry-visual .eyes{display:flex;gap:15%;margin-bottom:8%;}
.entry-visual .eye{width:18%;aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;}
.entry-visual .eye::after{content:'';width:50%;height:50%;border-radius:50%;background:#333;}
.entry-visual .mouth{width:30%;height:15%;border-radius:0 0 50% 50%;background:#333;}
.start-btn{
  padding:.8rem 3rem;font-size:clamp(1rem,3vw,1.3rem);font-weight:700;
  border:none;border-radius:50px;cursor:pointer;
  background:linear-gradient(135deg,var(--bili-pink),#ff4081);
  color:#fff;box-shadow:0 8px 30px rgba(251,114,153,.4);
  transition:all .3s;position:relative;overflow:hidden;
}
.start-btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(251,114,153,.6);}
.start-btn:active{transform:translateY(0);}
.start-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-100%);transition:transform .5s;}
.start-btn:hover::after{transform:translateX(100%);}

/* ===== 主交互区 ===== */
#main-screen{position:fixed;inset:0;display:none;}
#main-screen.active{display:block;}
#game-canvas{width:100%;height:100%;}

/* ===== HUD ===== */
.hud{position:fixed;top:0;left:0;right:0;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none;}
.hud>*{pointer-events:auto;}
.hud-left{display:flex;align-items:center;gap:.5rem;}
.hud-right{display:flex;align-items:center;gap:.5rem;}
.crazy-bar-wrap{width:clamp(80px,25vw,160px);height:14px;background:rgba(255,255,255,.15);border-radius:7px;overflow:hidden;position:relative;}
.crazy-bar{height:100%;border-radius:7px;transition:width .3s,background .3s;width:0%;}
.crazy-label{font-size:.75rem;opacity:.8;white-space:nowrap;}
.level-badge{
  padding:.2rem .6rem;border-radius:12px;font-size:.7rem;font-weight:700;
  background:rgba(255,255,255,.15);white-space:nowrap;
}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.12);color:#fff;font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.icon-btn:hover{background:rgba(255,255,255,.25);transform:scale(1.1);}
.icon-btn:active{transform:scale(.95);}

/* ===== 文字泡 ===== */
.text-bubble{
  position:fixed;z-index:20;padding:.6rem 1.2rem;border-radius:20px;
  font-size:clamp(.9rem,2.5vw,1.15rem);font-weight:700;
  pointer-events:none;white-space:nowrap;
  animation:bubbleIn .3s ease-out,bubbleOut .4s ease-in 1.2s forwards;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
@keyframes bubbleIn{from{opacity:0;transform:translateY(20px) scale(.5)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bubbleOut{to{opacity:0;transform:translateY(-40px) scale(.8)}}

/* ===== 分享面板 ===== */
.share-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
}
.share-overlay.active{display:flex;}
.share-panel{
  background:var(--bili-card);border-radius:16px;padding:1.5rem;
  width:min(90vw,400px);max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:panelIn .3s ease-out;
}
@keyframes panelIn{from{opacity:0;transform:scale(.8) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.share-panel h2{text-align:center;margin-bottom:1rem;font-size:1.2rem;}
.preview-canvas-wrap{
  width:100%;border-radius:12px;overflow:hidden;margin-bottom:1rem;
  background:#000;display:flex;align-items:center;justify-content:center;
}
#preview-canvas{max-width:100%;max-height:50vh;border-radius:12px;}
.share-btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.share-btn{
  padding:.5rem 1.2rem;border-radius:20px;border:none;cursor:pointer;
  font-size:.85rem;font-weight:600;color:#fff;transition:all .2s;
  display:flex;align-items:center;gap:.3rem;
}
.share-btn:hover{transform:translateY(-2px);}
.share-btn.download{background:linear-gradient(135deg,var(--bili-blue),#00c4cc);}
.share-btn.copy{background:linear-gradient(135deg,var(--crazy-3),#2ecc71);}
.share-btn.close{background:rgba(255,255,255,.15);}

/* ===== 粒子画布 ===== */
#particle-canvas{position:fixed;inset:0;pointer-events:none;z-index:5;}

/* ===== 连击提示 ===== */
.combo-display{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:clamp(2rem,8vw,4rem);font-weight:900;
  pointer-events:none;z-index:15;
  text-shadow:0 0 20px currentColor,0 0 40px currentColor;
  animation:comboFlash .6s ease-out forwards;
}
@keyframes comboFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(0.3) rotate(-15deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(0deg)}}

/* ===== 全屏发疯覆盖 ===== */
.crazy-overlay{
  position:fixed;inset:0;z-index:30;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.crazy-overlay.active{opacity:1;}

/* ===== 响应式 ===== */
@media(max-width:480px){
  .hud{padding:.5rem .6rem;}
  .crazy-label{display:none;}
  .level-badge{font-size:.65rem;}
}
</style>
</head>
<body>

<!-- ===== 入口页 ===== -->
<div id="entry-screen">
  <div class="entry-visual">
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
    </div>
  </div>
  <div class="entry-title">🎮 电子发疯模拟器</div>
  <div class="entry-subtitle">疯狂戳它！释放你的电子压力！<br>点击角色积累发疯值，解锁各种夸张反应！</div>
  <button class="start-btn" id="startBtn">🚀 开始发疯！</button>
</div>

<!-- ===== 主交互区 ===== -->
<div id="main-screen">
  <canvas id="game-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>
  <div class="crazy-overlay" id="crazyOverlay"></div>
  
  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="crazy-bar-wrap">
        <div class="crazy-bar" id="crazyBar"></div>
      </div>
      <span class="crazy-label">发疯值</span>
      <span class="level-badge" id="levelBadge">Lv.1 平静</span>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="shareBtn" title="分享海报">📤</button>
      <button class="icon-btn" id="resetBtn" title="重置">🔄</button>
    </div>
  </div>
</div>

<!-- ===== 分享面板 ===== -->
<div class="share-overlay" id="shareOverlay">
  <div class="share-panel">
    <h2>📸 分享你的发疯时刻</h2>
    <div class="preview-canvas-wrap">
      <canvas id="preview-canvas" width="400" height="500"></canvas>
    </div>
    <div class="share-btns">
      <button class="share-btn download" id="downloadBtn">💾 下载海报</button>
      <button class="share-btn copy" id="copyBtn">📋 复制图片</button>
      <button class="share-btn close" id="closeShareBtn">关闭</button>
    </div>
  </div>
</div>

<script>
// ==================== 核心变量 ====================
const $ = id => document.getElementById(id);
const gameCanvas = $('game-canvas');
const ctx = gameCanvas.getContext('2d');
const particleCanvas = $('particle-canvas');
const pCtx = particleCanvas.getContext('2d');
const previewCanvas = $('preview-canvas');
const prCtx = previewCanvas.getContext('2d');

let W, H, dpr;
let crazyValue = 0;
let maxCrazy = 100;
let level = 1;
let combo = 0;
let comboTimer = null;
let lastClickTime = 0;
let isRunning = false;
let animationId = null;

// 角色状态
let character = {
  x: 0, y: 0, baseX: 0, baseY: 0,
  radius: 80,
  rotation: 0,
  scale: 1,
  targetScale: 1,
  shakeX: 0, shakeY: 0,
  targetShakeX: 0, targetShakeY: 0,
  color: '#fb7299',
  eyeScale: 1,
  mouthOpen: 0,
  blushAlpha: 0,
  squish: 1,
  wobble: 0,
};

// 粒子系统
let particles = [];
let floatingTexts = [];

// 文字库
const textLibrary = [
  "啊啊啊啊！！！","我要疯了！！！","救命哈哈哈哈",
  "不活了！！！","笑死我了","电子发疯中...",
  "脑子要炸了！！！","别戳了！！！","呜呜呜呜",
  "哈哈哈哈哈哈","我裂开了！！！","疯了疯了",
  "这是什么鬼！！！","救命啊！！！","笑到头掉",
  "电子暴动！！！","CPU过载！！！","内存溢出！！！",
  "系统崩溃中...","404 Not Found","蓝屏警告！",
  "别停继续！！！","我要爆炸了","笑出腹肌",
  "救命我停不下来","这是人干的事吗","电子癫痫"
];

const levelNames = ['平静','烦躁','抓狂','暴走','终极发疯','电子核爆'];
const levelColors = ['#6bcb77','#ffd93d','#ff6b6b','#ff6bcf','#a855f7','#ff0000'];

// ==================== 初始化 ====================
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  [gameCanvas, particleCanvas].forEach(c => {
    c.width = W * dpr;
    c.height = H * dpr;
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  character.baseX = W / 2;
  character.baseY = H / 2;
  character.x = character.baseX;
  character.y = character.baseY;
  character.radius = Math.min(W, H) * 0.12;
}
window.addEventListener('resize', resize);
resize();

// ==================== 入口页 ====================
$('startBtn').addEventListener('click', () => {
  $('entry-screen').classList.add('hidden');
  setTimeout(() => {
    $('main-screen').classList.add('active');
    isRunning = true;
    gameLoop();
    generateFloatingText('点我开始！', W/2, H/2 - character.radius - 40);
  }, 600);
});

// ==================== 游戏循环 ====================
function gameLoop() {
  if (!isRunning) return;
  update();
  render();
  renderParticles();
  animationId = requestAnimationFrame(gameLoop);
}

function update() {
  const now = Date.now();
  
  // 发疯值自然衰减
  if (crazyValue > 0) {
    crazyValue = Math.max(0, crazyValue - 0.02);
    updateLevel();
  }
  
  // 平滑插值
  character.x += (character.baseX + character.targetShakeX - character.x) * 0.15;
  character.y += (character.baseY + character.targetShakeY - character.y) * 0.15;
  character.scale += (character.targetScale - character.scale) * 0.1;
  character.rotation *= 0.95;
  character.wobble *= 0.96;
  character.squish += (1 - character.squish) * 0.08;
  character.eyeScale += (1 - character.eyeScale) * 0.1;
  character.mouthOpen *= 0.95;
  character.blushAlpha *= 0.97;
  
  // 更新粒子
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.life -= p.decay;
    p.rotation += p.rotSpeed;
    return p.life > 0;
  });
  
  // 更新浮动文字
  floatingTexts = floatingTexts.filter(t => {
    t.y += t.vy;
    t.life -= 0.012;
    return t.life > 0;
  });
}

function render() {
  ctx.clearRect(0, 0, W, H);
  
  // 背景渐变
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  const overlay = $('crazyOverlay');
  if (level >= 5) {
    bgGrad.addColorStop(0, '#1a0030');
    bgGrad.addColorStop(1, '#000');
  } else if (level >= 3) {
    bgGrad.addColorStop(0, '#1a1a2e');
    bgGrad.addColorStop(1, '#0f0f1a');
  } else {
    bgGrad.addColorStop(0, '#1e1e2e');
    bgGrad.addColorStop(1, '#121218');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  // 绘制网格背景（高发疯时）
  if (level >= 3) {
    ctx.save();
    ctx.globalAlpha = 0.05 + level * 0.02;
    ctx.strokeStyle = levelColors[level - 1];
    ctx.lineWidth = 1;
    const gridSize = 40;
    const offset = (Date.now() / 50) % gridSize;
    for (let x = -gridSize + offset; x < W + gridSize; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = -gridSize + offset; y < H + gridSize; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }
  
  // 绘制角色
  drawCharacter();
  
  // 绘制浮动文字
  floatingTexts.forEach(t => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.font = `bold ${t.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 15;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  });
  
  // HUD更新
  updateHUD();
}

// ==================== 角色绘制 ====================
function drawCharacter() {
  const cx = character.x;
  const cy = character.y;
  const r = character.radius;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(character.rotation);
  ctx.scale(character.scale * character.squish, character.scale / character.squish);
  
  // 发光效果
  const glowIntensity = level * 0.15;
  if (glowIntensity > 0) {
    ctx.shadowColor = levelColors[level - 1];
    ctx.shadowBlur = 30 + level * 10;
  }
  
  // 身体
  const bodyGrad = ctx.createRadialGradient(0, -r * 0.1, 0, 0, 0, r);
  const baseColor = level >= 4 ? levelColors[level - 1] : character.color;
  bodyGrad.addColorStop(0, lightenColor(baseColor, 30));
  bodyGrad.addColorStop(0.7, baseColor);
  bodyGrad.addColorStop(1, darkenColor(baseColor, 30));
  
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  
  // 描边
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 腮红
  if (character.blushAlpha > 0.01) {
    ctx.globalAlpha = character.blushAlpha;
    [-1, 1].forEach(side => {
      ctx.beginPath();
      ctx.arc(side * r * 0.4, r * 0.15, r * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,100,100,0.5)';
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  
  // 眼睛
  const eyeY = -r * 0.1;
  const eyeSpacing = r * 0.3;
  const eyeR = r * 0.18 * character.eyeScale;
  
  [-1, 1].forEach(side => {
    // 眼白
    ctx.beginPath();
    ctx.ellipse(side * eyeSpacing, eyeY, eyeR, eyeR * 1.1, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    
    // 瞳孔
    const pupilOffset = side * eyeR * 0.15;
    ctx.beginPath();
    ctx.arc(side * eyeSpacing + pupilOffset, eyeY, eyeR * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    
    // 高光
    ctx.beginPath();
    ctx.arc(side * eyeSpacing + pupilOffset - eyeR * 0.15, eyeY - eyeR * 0.15, eyeR * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    
    // 高发疯时眼睛变红
    if (level >= 4) {
      ctx.beginPath();
      ctx.arc(side * eyeSpacing, eyeY, eyeR * 0.7, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,0,0,${(level - 3) * 0.15})`;
      ctx.fill();
    }
  });
  
  // 嘴巴
  const mouthY = r * 0.25;
  const mouthOpenAmount = character.mouthOpen;
  if (mouthOpenAmount > 0.05) {
    // 张嘴
    ctx.beginPath();
    ctx.ellipse(0, mouthY, r * 0.2, r * 0.15 * mouthOpenAmount, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    // 牙齿
    ctx.beginPath();
    ctx.rect(-r * 0.12, mouthY - r * 0.08 * mouthOpenAmount, r * 0.24, r * 0.04);
    ctx.fillStyle = '#fff';
    ctx.fill();
  } else {
    // 正常嘴巴
    ctx.beginPath();
    ctx.arc(0, mouthY, r * 0.12, 0, Math.PI);
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  
  // 高发疯时绘制额外的装饰
  if (level >= 3) {
    // 头顶电波
    const t = Date.now() / 200;
    for (let i = 0; i < level - 2; i++) {
      ctx.beginPath();
      const startAngle = t + i * 0.5;
      ctx.arc(0, -r * 0.8, r * 0.2 + i * 8, startAngle, startAngle + 1);
      ctx.strokeStyle = levelColors[level - 1];
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  
  if (level >= 5) {
    // 周围旋转的星星
    const t = Date.now() / 500;
    for (let i = 0; i < 6; i++) {
      const angle = t + (i / 6) * Math.PI * 2;
      const dist = r * 1.4;
      const sx = Math.cos(angle) * dist;
      const sy = Math.sin(angle) * dist;
      drawStar(sx, sy, 5, r * 0.08, r * 0.04);
    }
  }
  
  ctx.restore();
}

function drawStar(cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.closePath();
  ctx.fillStyle = levelColors[level - 1];
  ctx.shadowColor = levelColors[level - 1];
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ==================== 粒子系统 ====================
function spawnParticles(x, y, count, type = 'circle') {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      gravity: 0.1 + Math.random() * 0.15,
      life: 1,
      decay: 0.01 + Math.random() * 0.02,
      size: 3 + Math.random() * 8,
      color: levelColors[level - 1] || '#fb7299',
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      type: type === 'star' ? 'star' : (type === 'heart' ? 'heart' : 'circle')
    });
  }
}

function renderParticles() {
  pCtx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    pCtx.save();
    pCtx.globalAlpha = p.life;
    pCtx.translate(p.x, p.y);
    pCtx.rotate(p.rotation);
    
    if (p.type === 'star') {
      drawStarParticle(pCtx, 0, 0, 5, p.size, p.size * 0.4, p.color);
    } else if (p.type === 'heart') {
      drawHeartParticle(pCtx, 0, 0, p.size, p.color);
    } else {
      pCtx.beginPath();
      pCtx.arc(0, 0, p.size, 0, Math.PI * 2);
      pCtx.fillStyle = p.color;
      pCtx.shadowColor = p.color;
      pCtx.shadowBlur = 8;
      pCtx.fill();
    }
    pCtx.restore();
  });
}

function drawStarParticle(c, cx, cy, spikes, outerR, innerR, color) {
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  c.closePath();
  c.fillStyle = color;
  c.fill();
}

function drawHeartParticle(c, cx, cy, size, color) {
  c.beginPath();
  const topY = cy - size * 0.3;
  c.moveTo(cx, cy + size * 0.4);
  c.bezierCurveTo(cx - size, topY - size * 0.3, cx - size * 0.5, topY - size, cx, topY);
  c.bezierCurveTo(cx + size * 0.5, topY - size, cx + size, topY - size * 0.3, cx, cy + size * 0.4);
  c.fillStyle = color;
  c.fill();
}

// ==================== 浮动文字 ====================
function generateFloatingText(text, x, y, color) {
  floatingTexts.push({
    text: text || textLibrary[Math.floor(Math.random() * textLibrary.length)],
    x: x + (Math.random() - 0.5) * 60,
    y: y - 20,
    vy: -1.5 - Math.random(),
    life: 1.5,
    size: 16 + Math.random() * 12,
    color: color || levelColors[level - 1] || '#fff'
  });
}

// ==================== 点击交互 ====================
function handleClick(e) {
  if (!isRunning) return;
  
  const rect = gameCanvas.getBoundingClientRect();
  const cx = (e.clientX || e.touches?.[0]?.clientX || W/2) - rect.left;
  const cy = (e.clientY || e.touches?.[0]?.clientY || H/2) - rect.top;
  
  const dx = cx - character.baseX;
  const dy = cy - character.baseY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  const now = Date.now();
  
  // 检查是否点击到角色
  if (dist < character.radius * 1.5) {
    // 连击检测
    if (now - lastClickTime < 500) {
      combo++;
    } else {
      combo = 1;
    }
    lastClickTime = now;
    
    // 增加发疯值
    const addValue = 3 + combo * 0.5 + level * 0.3;
    crazyValue = Math.min(maxCrazy, crazyValue + addValue);
    updateLevel();
    
    // 触发反应
    triggerClickReaction(combo);
    
    // 生成文字
    const text = combo > 5 ? `连击 x${combo}！` : textLibrary[Math.floor(Math.random() * textLibrary.length)];
    generateFloatingText(text, character.baseX, character.baseY - character.radius);
    
    // 粒子效果
    const particleCount = Math.min(20, 5 + combo * 2);
    const particleType = level >= 4 ? 'star' : (level >= 2 ? 'heart' : 'circle');
    spawnParticles(character.baseX, character.baseY, particleCount, particleType);
    
    // 连击显示
    if (combo >= 3) {
      showCombo(combo);
    }
    
    // 清除连击计时器
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; }, 2000);
  }
}

function triggerClickReaction(comboLevel) {
  // 抖动
  character.targetShakeX = (Math.random() - 0.5) * (10 + level * 8);
  character.targetShakeY = (Math.random() - 0.5) * (10 + level * 8);
  
  // 缩放
  character.targetScale = 1.1 + level * 0.03;
  setTimeout(() => { character.targetScale = 1; }, 100);
  
  // 旋转
  character.rotation = (Math.random() - 0.5) * 0.3 * level;
  
  // 挤压
  character.squish = 0.85 + Math.random() * 0.1;
  
  // 表情
  character.eyeScale = 1.3 + level * 0.1;
  character.mouthOpen = 0.5 + level * 0.1;
  character.blushAlpha = 0.8;
  
  // 高发疯特效
  if (level >= 4) {
    document.body.style.animation = 'none';
    setTimeout(() => { document.body.style.animation = ''; }, 50);
  }
  
  if (level >= 5) {
    // 全屏闪光
    const overlay = $('crazyOverlay');
    overlay.style.background = `radial-gradient(circle, ${levelColors[level-1]}33, transparent)`;
    overlay.classList.add('active');
    setTimeout(() => overlay.classList.remove('active'), 200);
  }
}

function showCombo(c) {
  const existing = document.querySelector('.combo-display');
  if (existing) existing.remove();
  
  const el = document.createElement('div');
  el.className = 'combo-display';
  el.textContent = `${c} COMBO!`;
  el.style.color = levelColors[level - 1];
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ==================== 等级系统 ====================
function updateLevel() {
  const newLevel = crazyValue >= 90 ? 6 :
                   crazyValue >= 70 ? 5 :
                   crazyValue >= 50 ? 4 :
                   crazyValue >= 30 ? 3 :
                   crazyValue >= 15 ? 2 : 1;
  
  if (newLevel !== level) {
    level = newLevel;
    // 升级特效
    spawnParticles(character.baseX, character.baseY, 30, 'star');
    generateFloatingText(`Lv.${level} ${levelNames[level-1]}！`, character.baseX, character.baseY - character.radius - 30, levelColors[level-1]);
  }
}

function updateHUD() {
  const bar = $('crazyBar');
  const pct = (crazyValue / maxCrazy) * 100;
  bar.style.width = pct + '%';
  bar.style.background = `linear-gradient(90deg, ${levelColors[level-1]}, ${levelColors[Math.min(level, 5)]})`;
  
  const badge = $('levelBadge');
  badge.textContent = `Lv.${level} ${levelNames[level-1]}`;
  badge.style.background = `${levelColors[level-1]}33`;
  badge.style.color = levelColors[level-1];
}

// ==================== 分享海报 ====================
$('shareBtn').addEventListener('click', generateSharePoster);
$('closeShareBtn').addEventListener('click', () => $('shareOverlay').classList.remove('active'));
$('downloadBtn').addEventListener('click', downloadPoster);
$('copyBtn').addEventListener('click', copyPoster);

function generateSharePoster() {
  const overlay = $('shareOverlay');
  overlay.classList.add('active');
  
  const pw = 400, ph = 500;
  previewCanvas.width = pw;
  previewCanvas.height = ph;
  
  // 背景
  const bgGrad = prCtx.createLinearGradient(0, 0, pw, ph);
  bgGrad.addColorStop(0, '#1a1a2e');
  bgGrad.addColorStop(1, '#0f0f1a');
  prCtx.fillStyle = bgGrad;
  prCtx.fillRect(0, 0, pw, ph);
  
  // 网格
  prCtx.globalAlpha = 0.08;
  prCtx.strokeStyle = levelColors[level - 1];
  prCtx.lineWidth = 1;
  for (let x = 0; x < pw; x += 30) {
    prCtx.beginPath(); prCtx.moveTo(x, 0); prCtx.lineTo(x, ph); prCtx.stroke();
  }
  for (let y = 0; y < ph; y += 30) {
    prCtx.beginPath(); prCtx.moveTo(0, y); prCtx.lineTo(pw, y); prCtx.stroke();
  }
  prCtx.globalAlpha = 1;
  
  // 角色预览
  const cx = pw / 2, cy = ph * 0.38, r = 70;
  const bodyGrad = prCtx.createRadialGradient(cx, cy - 10, 0, cx, cy, r);
  bodyGrad.addColorStop(0, lightenColor(levelColors[level-1], 30));
  bodyGrad.addColorStop(1, levelColors[level-1]);
  
  prCtx.beginPath();
  prCtx.arc(cx, cy, r, 0, Math.PI * 2);
  prCtx.fillStyle = bodyGrad;
  prCtx.shadowColor = levelColors[level-1];
  prCtx.shadowBlur = 30;
  prCtx.fill();
  prCtx.shadowBlur = 0;
  
  // 眼睛
  const eyeY = cy - 8;
  const eyeSp = 22;
  [-1, 1].forEach(s => {
    prCtx.beginPath();
    prCtx.arc(cx + s * eyeSp, eyeY, 12, 0, Math.PI * 2);
    prCtx.fillStyle = '#fff';
    prCtx.fill();
    prCtx.beginPath();
    prCtx.arc(cx + s * eyeSp + s * 2, eyeY, 6, 0, Math.PI * 2);
    prCtx.fillStyle = '#1a1a2e';
    prCtx.fill();
  });
  
  // 嘴巴
  prCtx.beginPath();
  prCtx.arc(cx, cy + 20, 10, 0, Math.PI);
  prCtx.strokeStyle = '#1a1a2e';
  prCtx.lineWidth = 3;
  prCtx.stroke();
  
  // 标题
  prCtx.font = 'bold 28px "Segoe UI", sans-serif';
  prCtx.textAlign = 'center';
  prCtx.fillStyle = '#fff';
  prCtx.fillText('🎮 电子发疯模拟器', pw / 2, 40);
  
  // 等级信息
  prCtx.font = 'bold 22px "Segoe UI", sans-serif';
  prCtx.fillStyle = levelColors[level - 1];
  prCtx.fillText(`Lv.${level} ${levelNames[level-1]}`, pw / 2, ph * 0.62);
  
  // 发疯值
  prCtx.font = '16px "Segoe UI", sans-serif';
  prCtx.fillStyle = '#aaa';
  prCtx.fillText(`发疯值: ${Math.floor(crazyValue)} / ${maxCrazy}`, pw / 2, ph * 0.68);
  
  // 进度条
  const barW = 200, barH = 12;
  const barX = (pw - barW) / 2;
  const barY = ph * 0.72;
  prCtx.fillStyle = 'rgba(255,255,255,0.15)';
  prCtx.beginPath();
  prCtx.roundRect(barX, barY, barW, barH, 6);
  prCtx.fill();
  prCtx.fillStyle = levelColors[level - 1];
  prCtx.beginPath();
  prCtx.roundRect(barX, barY, barW * (crazyValue / maxCrazy), barH, 6);
  prCtx.fill();
  
  // 底部文字
  prCtx.font = '14px "Segoe UI", sans-serif';
  prCtx.fillStyle = '#666';
  prCtx.fillText('你也来试试能疯到什么程度！', pw / 2, ph - 30);
  prCtx.fillText('扫码体验 👉', pw / 2, ph - 10);
  
  // 装饰星星
  for (let i = 0; i < 5; i++) {
    const sx = 30 + Math.random() * (pw - 60);
    const sy = ph * 0.75 + Math.random() * (ph * 0.15);
    drawPreviewStar(prCtx, sx, sy, 4 + Math.random() * 4, levelColors[level-1]);
  }
}

function drawPreviewStar(c, cx, cy, size, color) {
  let rot = -Math.PI / 2;
  const step = Math.PI / 2.5;
  c.beginPath();
  c.moveTo(cx, cy - size);
  for (let i = 0; i < 5; i++) {
    c.lineTo(cx + Math.cos(rot) * size, cy + Math.sin(rot) * size);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * size * 0.4, cy + Math.sin(rot) * size * 0.4);
    rot += step;
  }
  c.closePath();
  c.fillStyle = color;
  c.globalAlpha = 0.6;
  c.fill();
  c.globalAlpha = 1;
}

function downloadPoster() {
  const link = document.createElement('a');
  link.download = `电子发疯_Lv${level}_${Date.now()}.png`;
  link.href = previewCanvas.toDataURL('image/png');
  link.click();
}

async function copyPoster() {
  try {
    const blob = await new Promise(resolve => previewCanvas.toBlob(resolve, 'image/png'));
    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': blob })
    ]);
    alert('✅ 图片已复制到剪贴板！');
  } catch (e) {
    alert('❌ 复制失败，请使用下载功能');
  }
}

// ==================== 重置 ====================
$('resetBtn').addEventListener('click', () => {
  crazyValue = 0;
  level = 1;
  combo = 0;
  particles = [];
  floatingTexts = [];
  character.targetScale = 1;
  character.rotation = 0;
  character.shakeX = 0;
  character.shakeY = 0;
  character.eyeScale = 1;
  character.mouthOpen = 0;
  character.blushAlpha = 0;
  character.squish = 1;
  updateHUD();
  generateFloatingText('已重置！继续戳我吧～', W/2, H/2 - character.radius - 30, '#6bcb77');
});

// ==================== 事件绑定 ====================
gameCanvas.addEventListener('click', handleClick);
gameCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleClick(e); }, { passive: false });

// 键盘支持
document.addEventListener('keydown', (e) => {
  if (!isRunning) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    handleClick({ clientX: W/2, clientY: H/2 });
  }
});

// ==================== 工具函数 ====================
function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, (num >> 16) + percent);
  const g = Math.min(255, ((num >> 8) & 0x00FF) + percent);
  const b = Math.min(255, (num & 0x0000FF) + percent);
  return `rgb(${r},${g},${b})`;
}

function darkenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.max(0, (num >> 16) - percent);
  const g = Math.max(0, ((num >> 8) & 0x00FF) - percent);
  const b = Math.max(0, (num & 0x0000FF) - percent);
  return `rgb(${r},${g},${b})`;
}

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.lineTo(x + w - r[1], y);
    this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
    this.lineTo(x + w, y + h - r[2]);
    this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
    this.lineTo(x + r[3], y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
    this.lineTo(x, y + r[0]);
    this.quadraticCurveTo(x, y, x + r[0], y);
    this.closePath();
    return this;
  };
}

// 防止双击缩放
document.addEventListener('dblclick', e => e.preventDefault());
