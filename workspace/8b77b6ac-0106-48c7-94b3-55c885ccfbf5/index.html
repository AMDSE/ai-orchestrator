<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 B站热梗扭蛋机 - 网络热梗收集玩具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bilipink: #FB7299;
  --bilipink-light: #FC94B0;
  --bilipink-dark: #E84F7A;
  --blue: #00A1D6;
  --blue-light: #23C6F1;
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --text: #222;
  --text2: #666;
  --text3: #999;
  --border: #E3E5E7;
  --gold: #FFB800;
  --purple: #9B59B6;
  --green: #2ECC71;
  --red: #E74C3C;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
}

/* 顶部导航 */
.navbar {
  position: sticky; top:0; z-index:1000;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  display:flex; align-items:center; gap:10px;
  font-weight:900; font-size:20px; color:var(--bilipink);
  cursor:pointer;
}
.nav-brand .logo-icon {
  width:36px; height:36px;
  background: linear-gradient(135deg, var(--bilipink), var(--bilipink-light));
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:18px;
}
.nav-links { display:flex; gap:6px; align-items:center; }
.nav-link {
  padding:8px 16px; border-radius:20px;
  font-size:14px; font-weight:700; color:var(--text2);
  cursor:pointer; transition:all 0.2s;
  text-decoration:none;
}
.nav-link:hover, .nav-link.active {
  background: var(--bilipink); color:#fff;
}
.nav-user {
  display:flex; align-items:center; gap:10px;
}
.avatar {
  width:36px; height:36px; border-radius:50%;
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:900; font-size:14px;
  cursor:pointer; border:2px solid #fff;
  box-shadow: 0 2px 8px rgba(0,161,214,0.3);
}
.coins-display {
  display:flex; align-items:center; gap:4px;
  background: linear-gradient(135deg, #FFF3E0, #FFE0B2);
  padding:6px 14px; border-radius:20px;
  font-weight:700; font-size:14px; color:#E65100;
  border:1px solid #FFCC02;
}

/* 主容器 */
.main-container {
  max-width: 1200px; margin: 0 auto; padding: 20px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px;
}

/* 卡片通用样式 */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* 扭蛋机区域 */
.gacha-section { display:flex; flex-direction:column; gap:20px; }

.gacha-machine {
  background: linear-gradient(180deg, #fff 0%, #FFF0F5 100%);
  border-radius: var(--radius);
  padding: 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.gacha-machine::before {
  content:'';
  position:absolute; top:-50%; left:-50%;
  width:200%; height:200%;
  background: radial-gradient(circle, rgba(255,114,153,0.05) 0%, transparent 70%);
  animation: rotateBg 20s linear infinite;
}
@keyframes rotateBg { to { transform: rotate(360deg); } }

.gacha-title {
  font-size: 28px; font-weight: 900;
  background: linear-gradient(135deg, var(--bilipink), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.gacha-subtitle { color:var(--text3); font-size:14px; margin-bottom:20px; }

.gacha-display {
  width: 220px; height: 220px;
  margin: 0 auto 20px;
  position: relative;
  display:flex; align-items:center; justify-content:center;
}
.gacha-ball {
  width:180px; height:180px;
  border-radius:50%;
  background: linear-gradient(135deg, var(--bilipink), var(--bilipink-light), var(--gold));
  background-size: 300% 300%;
  animation: ballShine 3s ease infinite;
  display:flex; align-items:center; justify-content:center;
  font-size:60px; cursor:pointer;
  box-shadow: 0 8px 32px rgba(255,114,153,0.4), inset 0 -8px 20px rgba(0,0,0,0.1);
  transition: transform 0.3s;
  position:relative;
}
.gacha-ball:hover { transform: scale(1.05); }
.gacha-ball:active { transform: scale(0.95); }
.gacha-ball.spinning { animation: ballSpin 0.6s ease-in-out; }
@keyframes ballShine {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes ballSpin {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(90deg) scale(0.8); }
  50% { transform: rotate(180deg) scale(1.1); }
  75% { transform: rotate(270deg) scale(0.9); }
  100% { transform: rotate(360deg) scale(1); }
}

.gacha-ball .hole {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  width:50px; height:20px;
  background: rgba(255,255,255,0.3);
  border-radius:50%;
}

.gacha-buttons {
  display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
}
.btn {
  padding:12px 28px; border:none; border-radius:25px;
  font-size:15px; font-weight:700; cursor:pointer;
  transition: all 0.2s;
  display:flex; align-items:center; gap:8px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--bilipink), var(--bilipink-dark));
  color:#fff;
  box-shadow: 0 4px 16px rgba(255,114,153,0.4);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(255,114,153,0.5); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.btn-secondary {
  background: var(--card); color:var(--bilipink);
  border:2px solid var(--bilipink);
}
.btn-secondary:hover { background: var(--bilipink); color:#fff; }
.btn-blue {
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  color:#fff;
  box-shadow: 0 4px 16px rgba(0,161,214,0.4);
}

/* 结果弹窗 */
.result-overlay {
  position:fixed; inset:0; z-index:9999;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display:none; align-items:center; justify-content:center;
}
.result-overlay.show { display:flex; }
.result-card {
  background:#fff; border-radius:20px;
  padding:40px; text-align:center;
  max-width:360px; width:90%;
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position:relative;
}
@keyframes popIn {
  0% { transform: scale(0.3); opacity:0; }
  100% { transform: scale(1); opacity:1; }
}
.result-rarity {
  font-size:14px; font-weight:700;
  padding:4px 16px; border-radius:20px;
  display:inline-block; margin-bottom:12px;
}
.rarity-N { background:#EEE; color:#666; }
.rarity-R { background:#E3F2FD; color:#1976D2; }
.rarity-SR { background:#F3E5F5; color:#7B1FA2; }
.rarity-SSR { background:linear-gradient(135deg, #FFF8E1, #FFECB3); color:#F57F17; border:1px solid #FFD54F; }
.rarity-UR {
  background:linear-gradient(135deg, #FFEBEE, #FCE4EC, #FFF8E1);
  color:#D32F2F; border:1px solid #FFCDD2;
  animation: urGlow 1.5s ease infinite;
}
@keyframes urGlow {
  0%,100% { box-shadow: 0 0 10px rgba(255,0,0,0.2); }
  50% { box-shadow: 0 0 25px rgba(255,0,0,0.4); }
}
.result-emoji { font-size:80px; margin:10px 0; animation: bounce 0.6s ease; }
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(-20px); }
  60% { transform: translateY(-10px); }
}
.result-name { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-desc { color:var(--text2); font-size:14px; margin-bottom:20px; line-height:1.6; }
.result-tags { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
.result-tag {
  padding:3px 10px; border-radius:12px;
  font-size:12px; background:#F0F0F0; color:var(--text2);
}

/* 收藏区域 */
.collection-section { margin-top:10px; }
.section-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.section-title {
  font-size:18px; font-weight:900;
  display:flex; align-items:center; gap:8px;
}
.section-title i { color:var(--bilipink); }
.collection-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap:12px;
}
.meme-card {
  background:#fff; border-radius:var(--radius-sm);
  padding:16px; text-align:center;
  box-shadow: var(--shadow);
  cursor:pointer; transition: all 0.3s;
  position:relative; overflow:hidden;
}
.meme-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.meme-card .card-emoji { font-size:42px; margin-bottom:8px; }
.meme-card .card-name { font-size:13px; font-weight:700; margin-bottom:4px; }
.meme-card .card-rarity-badge {
  position:absolute; top:8px; right:8px;
  width:8px; height:8px; border-radius:50%;
}
.meme-card .card-count {
  position:absolute; top:8px; left:8px;
  background:var(--bilipink); color:#fff;
  font-size:11px; font-weight:700;
  padding:2px 8px; border-radius:10px;
}
.empty-collection {
  grid-column: 1/-1;
  text-align:center; padding:40px;
  color:var(--text3);
}
.empty-collection i { font-size:48px; margin-bottom:12px; opacity:0.3; }

/* 侧边栏 */
.sidebar { display:flex; flex-direction:column; gap:16px; }

/* 弹幕区域 */
.danmaku-box {
  background:#1a1a2e; border-radius:var(--radius);
  overflow:hidden; box-shadow: var(--shadow);
}
.danmaku-header {
  background: linear-gradient(90deg, #16213e, #1a1a2e);
  padding:12px 16px;
  display:flex; align-items:center; justify-content:space-between;
  color:#fff;
}
.danmaku-header span { font-weight:700; font-size:14px; }
.danmaku-header .live-dot {
  width:8px; height:8px; border-radius:50%;
  background:#FF4444;
  animation: livePulse 1s ease infinite;
}
@keyframes livePulse {
  0%,100% { opacity:1; }
  50% { opacity:0.3; }
}
.danmaku-screen {
  height: 260px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #0f0f23, #1a1a2e);
}
.danmaku-item {
  position: absolute;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  pointer-events: none;
  animation: danmakuFlow linear forwards;
}
@keyframes danmakuFlow {
  from { transform: translateX(100%); }
  to { transform: translateX(calc(-100% - 100vw)); }
}
.danmaku-input-row {
  display:flex; padding:8px;
  background:#16213e;
  gap:6px;
}
.danmaku-input-row input {
  flex:1; padding:8px 12px;
  border:none; border-radius:20px;
  background:#0f0f23; color:#fff;
  font-size:13px; outline:none;
}
.danmaku-input-row input::placeholder { color:#555; }
.danmaku-input-row button {
  padding:8px 16px; border:none; border-radius:20px;
  background:var(--bilipink); color:#fff;
  font-weight:700; cursor:pointer; font-size:13px;
}

/* 排行榜 */
.rank-list { padding:12px; }
.rank-item {
  display:flex; align-items:center; gap:10px;
  padding:10px; border-radius:var(--radius-sm);
  transition: background 0.2s; cursor:pointer;
}
.rank-item:hover { background: var(--bg); }
.rank-num {
  width:24px; height:24px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:900;
}
.rank-num.top1 { background:#FFD700; color:#B8860B; }
.rank-num.top2 { background:#C0C0C0; color:#666; }
.rank-num.top3 { background:#CD7F32; color:#fff; }
.rank-num.normal { background:#EEE; color:#999; }
.rank-avatar {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#fff;
}
.rank-info { flex:1; }
.rank-name { font-size:13px; font-weight:700; }
.rank-score { font-size:11px; color:var(--text3); }

/* 评论区 */
.comment-section { padding:16px; }
.comment-input-area {
  display:flex; gap:8px; margin-bottom:16px;
}
.comment-input-area input {
  flex:1; padding:10px 14px;
  border:1px solid var(--border); border-radius:20px;
  font-size:14px; outline:none;
  transition: border-color 0.2s;
}
.comment-input-area input:focus { border-color: var(--bilipink); }
.comment-item {
  display:flex; gap:10px; padding:12px 0;
  border-bottom:1px solid #F0F0F0;
}
.comment-item:last-child { border-bottom:none; }
.comment-avatar {
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#fff;
  flex-shrink:0;
}
.comment-body { flex:1; }
.comment-user { font-size:13px; font-weight:700; color:var(--blue); }
.comment-text { font-size:13px; color:var(--text); margin:4px 0; line-height:1.5; }
.comment-time { font-size:11px; color:var(--text3); }

/* 通知提示 */
.toast {
  position:fixed; top:80px; left:50%; transform:translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.85); color:#fff;
  padding:12px 24px; border-radius:25px;
  font-size:14px; font-weight:700;
  z-index:10000; opacity:0;
  transition: all 0.3s;
  pointer-events:none;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 粒子效果 */
.particle {
  position:fixed; pointer-events:none; z-index:9998;
  font-size:20px;
  animation: particleFly 1s ease-out forwards;
}
@keyframes particleFly {
  0% { opacity:1; transform: translate(0,0) scale(1); }
  100% { opacity:0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

/* 模态框 */
.modal-overlay {
  position:fixed; inset:0; z-index:10001;
  background: rgba(0,0,0,0.5);
  display:none; align-items:center; justify-content:center;
}
.modal-overlay.show { display:flex; }
.modal-box {
  background:#fff; border-radius:16px;
  padding:30px; max-width:400px; width:90%;
  animation: popIn 0.3s ease;
}
.modal-title { font-size:18px; font-weight:900; margin-bottom:16px; }
.modal-input {
  width:100%; padding:12px 16px;
  border:2px solid var(--border); border-radius:10px;
  font-size:15px; outline:none; margin-bottom:16px;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--bilipink); }
.modal-buttons { display:flex; gap:10px; justify-content:flex-end; }

/* 标签栏 */
.tab-bar {
  display:flex; gap:4px;
  background:#fff; border-radius:var(--radius);
  padding:4px; margin-bottom:16px;
  box-shadow: var(--shadow);
}
.tab-btn {
  flex:1; padding:10px; border:none; border-radius:10px;
  font-size:14px; font-weight:700; cursor:pointer;
  background:transparent; color:var(--text2);
  transition: all 0.2s;
}
.tab-btn.active { background:var(--bilipink); color:#fff; }
.tab-btn:hover:not(.active) { background:var(--bg); }

/* 响应式 */
@media (max-width: 900px) {
  .main-container { grid-template-columns: 1fr; }
  .sidebar { order: -1; }
  .collection-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
@media (max-width: 600px) {
  .navbar { padding:0 12px; }
  .nav-links { display:none; }
  .gacha-display { width:160px; height:160px; }
  .gacha-ball { width:130px; height:130px; font-size:44px; }
  .gacha-title { font-size:22px; }
}

/* 滚动条美化 */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#CCC; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#999; }

/* 浮动热梗标签 */
.floating-tags {
  position:fixed; bottom:20px; left:20px;
  display:flex; flex-wrap:wrap; gap:6px;
  max-width:300px; z-index:100;
}
.float-tag {
  padding:4px 12px; border-radius:15px;
  font-size:12px; font-weight:700;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  cursor:pointer; transition: all 0.2s;
  animation: tagFloat 3s ease-in-out infinite;
}
.float-tag:hover { transform: scale(1.1); }
@keyframes tagFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* 进度条 */
.progress-bar {
  height:6px; background:#EEE; border-radius:3px;
  overflow:hidden; margin:10px 0;
}
.progress-fill {
  height:100%; border-radius:3px;
  background: linear-gradient(90deg, var(--bilipink), var(--gold));
  transition: width 0.5s ease;
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
  <div class="nav-brand" onclick="location.reload()">
    <div class="logo-icon"><i class="fas fa-fire"></i></div>
    <span>热梗扭蛋机</span>
  </div>
  <div class="nav-links">
    <a class="nav-link active" data-tab="gacha" onclick="switchTab('gacha')"><i class="fas fa-gift"></i> 扭蛋</a>
    <a class="nav-link" data-tab="collection" onclick="switchTab('collection')"><i class="fas fa-book"></i> 图鉴</a>
    <a class="nav-link" data-tab="rank" onclick="switchTab('rank')"><i class="fas fa-trophy"></i> 排行</a>
    <a class="nav-link" data-tab="share" onclick="shareApp()"><i class="fas fa-share-alt"></i> 分享</a>
  </div>
  <div class="nav-user">
    <div class="coins-display"><i class="fas fa-coins"></i> <span id="coinCount">100</span></div>
    <div class="avatar" id="userAvatar" onclick="showLoginModal()" title="点击登录">?</div>
  </div>
</nav>

<!-- 主内容 -->
<div class="main-container">
  <!-- 左侧主区域 -->
  <div class="gacha-section">
    <!-- 扭蛋机 -->
    <div class="gacha-machine" id="gachaSection">
      <div class="gacha-title">🔥 热梗扭蛋机 🔥</div>
      <div class="gacha-subtitle">收集全网最火B站热梗，看看你的运气如何！</div>
      <div class="gacha-display">
        <div class="gacha-ball" id="gachaBall" onclick="doGacha(1)">
          <div class="hole"></div>
          <span>🎁</span>
        </div>
      </div>
      <div class="gacha-buttons">
        <button class="btn btn-primary" id="btnGacha1" onclick="doGacha(1)">
          <i class="fas fa-dice"></i> 抽一次 <small>(10币)</small>
        </button>
        <button class="btn btn-primary" id="btnGacha10" onclick="doGacha(10)">
          <i class="fas fa-dice-d20"></i> 十连抽 <small>(90币)</small>
        </button>
        <button class="btn btn-secondary" onclick="earnCoins()">
          <i class="fas fa-coins"></i> 赚金币
        </button>
      </div>
      <div style="margin-top:16px;">
        <div style="font-size:13px; color:var(--text3); margin-bottom:6px;">
          图鉴完成度: <span id="collectionProgress">0</span>/<span id="totalMemes">0</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
    </div>

    <!-- 收藏/图鉴区域 -->
    <div class="card collection-section" id="collectionSection" style="padding:20px;">
      <div class="section-header">
        <div class="section-title"><i class="fas fa-book-open"></i> 我的热梗图鉴</div>
        <span style="font-size:13px; color:var(--text3);" id="collectionCount">已收集 0 个</span>
      </div>
      <div class="tab-bar">
        <button class="tab-btn active" onclick="filterCollection('all', this)">全部</button>
        <button class="tab-btn" onclick="filterCollection('UR', this)">UR</button>
        <button class="tab-btn" onclick="filterCollection('SSR', this)">SSR</button>
        <button class="tab-btn" onclick="filterCollection('SR', this)">SR</button>
        <button class="tab-btn" onclick="filterCollection('R', this)">R</button>
        <button class="tab-btn" onclick="filterCollection('N', this)">N</button>
      </div>
      <div class="collection-grid" id="collectionGrid">

// ==================== 扭蛋核心逻辑 ====================
function getRandomMeme() {
  const rand = Math.random();
  let cumulative = 0;
  let targetRarity = 'N';
  
  for (const [rarity, config] of Object.entries(RARITY_CONFIG)) {
    cumulative += config.chance;
    if (rand <= cumulative) {
      targetRarity = rarity;
      break;
    }
  }
  
  const pool = MEME_DATABASE.filter(m => m.rarity === targetRarity);
  return pool[Math.floor(Math.random() * pool.length)];
}

function doGacha(count) {
  const cost = count === 1 ? 10 : 90;
  if (state.coins < cost) {
    showToast('金币不足！点击"赚金币"获取更多~');
    return;
  }
  
  state.coins -= cost;
  state.totalPulls += count;
  
  const ball = document.getElementById('gachaBall');
  ball.classList.add('spinning');
  
  // 禁用按钮
  document.getElementById('btnGacha1').disabled = true;
  document.getElementById('btnGacha10').disabled = true;
  
  setTimeout(() => {
    ball.classList.remove('spinning');
    document.getElementById('btnGacha1').disabled = false;
    document.getElementById('btnGacha10').disabled = false;
    
    const results = [];
    for (let i = 0; i < count; i++) {
      const meme = getRandomMeme();
      results.push(meme);
      state.collection[meme.id] = (state.collection[meme.id] || 0) + 1;
    }
    
    saveState();
    updateUI();
    
    // 显示结果
    if (count === 1) {
      showResult(results[0]);
    } else {
      // 十连抽显示最好的
      const best = results.reduce((a, b) => {
        const order = ['N','R','SR','SSR','UR'];
        return order.indexOf(a.rarity) > order.indexOf(b.rarity) ? a : b;
      });
      showResult(best, results);
    }
    
    // 发送弹幕
    const bestRarity = results.reduce((a,b) => {
      const order = ['N','R','SR','SSR','UR'];
      return order.indexOf(a.rarity) > order.indexOf(b.rarity) ? a : b;
    });
    if (bestRarity.rarity === 'UR' || bestRarity.rarity === 'SSR') {
      addDanmaku(`🎉 ${state.user || '匿名'}抽到了${bestRarity.rarity}【${bestRarity.name}】！`, true);
    }
    
    // 粒子效果
    spawnParticles();
    
  }, 600);
}

  document.getElementById('resultEmoji').textContent = meme.emoji;
  document.getElementById('resultName').textContent = meme.name;
  document.getElementById('resultDesc').textContent = meme.desc;
  document.getElementById('resultTags').innerHTML = meme.tags.map(t => 
    `<span class="result-tag">#${t}</span>`
  ).join('');
  
  if (allResults) {
    document.getElementById('resultDesc').textContent = 
      `十连抽完成！共获得 ${allResults.length} 张卡片，最佳：${meme.name}`;
  }
  
  overlay.classList.add('show');
}

function closeResult() {
  document.getElementById('resultOverlay').classList.remove('show');
}

// ==================== 收藏系统 ====================
function renderCollection() {
  const grid = document.getElementById('collectionGrid');
  const memes = state.filter === 'all' 
    ? MEME_DATABASE 
    : MEME_DATABASE.filter(m => m.rarity === state.filter);
  
  const collected = memes.filter(m => state.collection[m.id]);
  
  if (collected.length === 0 && state.filter === 'all') {
    grid.innerHTML = `
      <div class="empty-collection">
        <i class="fas fa-box-open"></i>
        <p>还没有收集到热梗哦~</p>
        <p style="font-size:12px;">快去扭蛋机抽取吧！</p>
      </div>`;
    return;
  }
  
  let html = '';
  memes.forEach(meme => {
    const count = state.collection[meme.id] || 0;
    const rarityConf = RARITY_CONFIG[meme.rarity];
    html += `
      <div class="meme-card" onclick="showMemeDetail('${meme.id}')" style="${count===0 && state.filter!=='all' ? 'opacity:0.4;' : ''}">
        <div class="card-rarity-badge" style="background:${RARITY_COLORS[meme.rarity]};"></div>
        ${count > 0 ? `<div class="card-count">×${count}</div>` : ''}
        <div class="card-emoji">${meme.emoji}</div>
        <div class="card-name">${meme.name}</div>
        <div style="font-size:11px; color:${rarityConf.color}; font-weight:700; margin-top:2px;">${meme.rarity}</div>
      </div>`;
  });
  
  grid.innerHTML = html;
}

function filterCollection(filter, btn) {
  state.filter = filter;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCollection();
}

function showMemeDetail(memeId) {
  const meme = MEME_DATABASE.find(m => m.id === memeId);
  if (!meme) return;
  const count = state.collection[memeId] || 0;
  if (count === 0) {
    showToast('还没有获得这个热梗，去扭蛋吧！');
    return;
  }
  showResult(meme);
}

// ==================== 弹幕系统 ====================
function addDanmaku(text, isSystem=false) {
  const screen = document.getElementById('danmakuScreen');
  const item = document.createElement('div');
  item.className = 'danmaku-item';
  item.textContent = text;
  
  const top = Math.random() * 80 + 5; // 5% - 85%
  const duration = 8 + Math.random() * 6; // 8-14s
  const colors = ['#fff','#FFD700','#FF69B4','#00E5FF','#76FF03','#FF9100'];
  const color = isSystem ? '#FFD700' : colors[Math.floor(Math.random()*colors.length)];
  
  item.style.top = top + '%';
  item.style.color = color;
  item.style.animationDuration = duration + 's';
  item.style.fontSize = (13 + Math.random()*3) + 'px';
  
  screen.appendChild(item);
  
  setTimeout(() => item.remove(), duration * 1000);
}

function sendDanmaku() {
  const input = document.getElementById('danmakuInput');
  const text = input.value.trim();
  if (!text) return;
  addDanmaku(`[${state.user || '匿名'}] ${text}`);
  input.value = '';
}

function startDanmakuAuto() {
  setInterval(() => {
    const text = PRESET_DANMAKU[Math.floor(Math.random() * PRESET_DANMAKU.length)];
    addDanmaku(text, true);
  }, 3000 + Math.random() * 4000);
}

// ==================== 评论系统 ====================
function renderComments() {
  const list = document.getElementById('commentList');
  list.innerHTML = state.comments.slice(0, 20).map(c => `
    <div class="comment-item">
      <div class="comment-avatar" style="background:${c.avatar};">${c.user.charAt(0)}</div>
      <div class="comment-body">
        <div class="comment-user">${c.user}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${c.time || '刚刚'}</div>
      </div>
    </div>
  `).join('');
}

function submitComment() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  if (!state.user) {
    showToast('请先登录再评论~');
    showLoginModal();
    return;
  }
  
  const colors = ['#E91E63','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4'];
  state.comments.unshift({
    user: state.user,
    avatar: colors[Math.floor(Math.random()*colors.length)],
    text: text,
    time: '刚刚'
  });
  saveState();
  renderComments();
  input.value = '';
  showToast('评论发送成功！');
}

// ==================== 排行榜 ====================
function renderRank() {
  const list = document.getElementById('rankList');
  // 把当前用户也加进去
  let ranks = [...RANK_DATA];
  if (state.user) {
    const collected = Object.keys(state.collection).length;
    ranks.push({ name: state.user + ' (你)', score: collected, avatar: '#FB7299' });
  }
  ranks.sort((a,b) => b.score - a.score);
  
  list.innerHTML = ranks.slice(0, 8).map((r, i) => `
    <div class="rank-item">
      <div class="rank-num ${i<3 ? 'top'+(i+1) : 'normal'}">${i+1}</div>
      <div class="rank-avatar" style="background:${r.avatar};">${r.name.charAt(0)}</div>
      <div class="rank-info">
        <div class="rank-name">${r.name}</div>
        <div class="rank-score">已收集 ${r.score} 个热梗</div>
      </div>
    </div>
  `).join('');
}

// ==================== 今日热梗 ====================
function renderTodayHot() {
  const container = document.getElementById('todayHot');
  const tags = ['恐龙抗狼','科目三','命运的齿轮','纯爱战士','泼天的富贵','city不city','显眼包','i人e人','真香','遥遥领先'];
  container.innerHTML = tags.map(t => 
    `<span style="padding:4px 10px; border-radius:12px; font-size:12px; font-weight:700; background:#FFF0F5; color:var(--bilipink); cursor:pointer;" onclick="addDanmaku('#${t}# 太火了！', true)">#${t}</span>`
  ).join('');
}

// ==================== 浮动标签 ====================
function renderFloatingTags() {
  const container = document.getElementById('floatingTags');
  const tags = ['🔥 热梗','💃 科目三','🐉 恐龙抗狼','🎭 命运的齿轮'];
  container.innerHTML = tags.map((t,i) => 
    `<span class="float-tag" style="animation-delay:${i*0.5}s;" onclick="addDanmaku('${t} 永远的神！', true)">${t}</span>`
  ).join('');
}

// ==================== 登录系统 ====================
function showLoginModal() {
  document.getElementById('loginModal').classList.add('show');
  setTimeout(() => document.getElementById('loginInput').focus(), 100);
}

function closeLoginModal() {
  document.getElementById('loginModal').classList.remove('show');
}

function doLogin() {
  const name = document.getElementById('loginInput').value.trim();
  if (!name) {
    showToast('请输入昵称~');
    return;
  }
  state.user = name;
  saveState();
  updateUI();
  closeLoginModal();
  showToast(`欢迎回来，${name}！`);
  addDanmaku(`👋 ${name} 加入了热梗扭蛋机！`, true);
  renderRank();
}

// ==================== 金币系统 ====================
function earnCoins() {
  const earned = 20 + Math.floor(Math.random() * 30);
  state.coins += earned;
  saveState();
  updateUI();
  showToast(`获得 ${earned} 金币！`);
  
  // 动画效果
  const coinEl = document.getElementById('coinCount');
  coinEl.style.transform = 'scale(1.3)';
  coinEl.style.color = '#FF6D00';
  setTimeout(() => {
    coinEl.style.transform = 'scale(1)';
    coinEl.style.color = '';
  }, 300);
}

// ==================== 分享系统 ====================
function shareApp() {
  const link = window.location.href;
  document.getElementById('shareLink').value = link;
  document.getElementById('shareModal').classList.add('show');
}

function closeShareModal() {
  document.getElementById('shareModal').classList.remove('show');
}

function copyShareLink() {
  const input = document.getElementById('shareLink');
  input.select();
  try {
    navigator.clipboard.writeText(input.value).then(() => {
      showToast('链接已复制！快去分享给好友吧~');
    });
  } catch(e) {
    document.execCommand('copy');
    showToast('链接已复制！');
  }
}

function shareResult() {
  closeResult();
  shareApp();
}

// ==================== 标签切换 ====================
function switchTab(tab) {
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  document.querySelector(`.nav-link[data-tab="${tab}"]`)?.classList.add('active');
  
  const sections = {
    gacha: 'gachaSection',
    collection: 'collectionSection',
    rank: 'rankList',
  };
  
  if (tab === 'gacha') {
    document.getElementById('gachaSection').scrollIntoView({behavior:'smooth'});
  } else if (tab === 'collection') {
    document.getElementById('collectionSection').scrollIntoView({behavior:'smooth'});
  }
}

// ==================== 粒子效果 ====================
function spawnParticles() {
  const emojis = ['✨','🌟','💫','⭐','🎉','🎊'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left = (40 + Math.random()*20) + 'vw';
    p.style.top = (40 + Math.random()*20) + 'vh';
    p.style.setProperty('--tx', (Math.random()-0.5)*300 + 'px');
    p.style.setProperty('--ty', (Math.random()-0.5)*300 + 'px');
    p.style.fontSize = (16 + Math.random()*16) + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ==================== 在线人数模拟 ====================
function updateOnlineCount() {
  const base = 1000 + Math.floor(Math.random() * 500);
  document.getElementById('onlineCount').textContent = base.toLocaleString() + ' 在线';
}
setInterval(updateOnlineCount, 10000);

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeResult();
    closeLoginModal();
    closeShareModal();
  }
  if (e.key === ' ' && !e.target.closest('input')) {
    e.preventDefault();
    doGacha(1);
  }
});

// ==================== 启动 ====================
init();
</script>
</body>
</html>
