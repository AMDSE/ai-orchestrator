<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 网络热梗玩具箱 - Meme Toy Box</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #1a1a2e;
            --accent: #ff6b6b;
            --accent2: #feca57;
            --accent3: #48dbfb;
            --accent4: #ff9ff3;
            --text: #f0f0f0;
            --glow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 107, 107, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(72, 219, 251, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(254, 202, 87, 0.06) 0%, transparent 50%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            overflow-x: hidden;
            cursor: default;
        }

        /* 粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* 头部 */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px 30px;
        }
        .header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3), var(--accent4));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 30px rgba(255, 107, 107, 0.3));
            letter-spacing: 2px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle {
            font-size: 1rem;
            color: #888;
            margin-top: 8px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px 24px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .stat-item:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-2px);
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent2);
        }
        .stat-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 28px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 107, 107, 0.3);
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
        }
        .btn:hover::before {
            width: 300px;
            height: 300px;
        }
        .btn:hover {
            border-color: var(--accent);
            box-shadow: var(--glow);
            transform: translateY(-3px);
        }
        .btn:active {
            transform: translateY(0) scale(0.95);
        }
        .btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
        }

        /* 网格 */
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 卡片 */
        .meme-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .meme-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.03) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .meme-card:hover::after {
            opacity: 1;
        }
        .meme-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .meme-card:active {
            transform: translateY(-4px) scale(0.98);
        }
        .meme-card.shake {
            animation: cardShake 0.6s ease;
        }
        @keyframes cardShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px) rotate(-2deg); }
            40% { transform: translateX(10px) rotate(2deg); }
            60% { transform: translateX(-6px) rotate(-1deg); }
            80% { transform: translateX(6px) rotate(1deg); }
        }
        .meme-card.pop {
            animation: cardPop 0.5s ease;
        }
        @keyframes cardPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .meme-emoji {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }
        .meme-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
        }
        .meme-desc {
            font-size: 0.85rem;
            color: #999;
            text-align: center;
            line-height: 1.5;
        }
        .meme-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .meme-counter {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 0.7rem;
            color: #555;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            transform: scale(0.8) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
        }
        .modal-emoji {
            font-size: 5rem;
            margin-bottom: 16px;
            animation: bounce 1s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .modal h2 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .modal p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-close {
            padding: 10px 30px;
            border: 2px solid var(--accent);
            border-radius: 50px;
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .modal-close:hover {
            background: var(--accent);
            color: #fff;
        }

        /* 连击提示 */
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent2);
            text-shadow: 0 0 40px rgba(254, 202, 87, 0.8);
            pointer-events: none;
            z-index: 999;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .combo-display.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 底部 */
        .footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px;
            color: #444;
            font-size: 0.8rem;
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .meme-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                gap: 10px;
            }
            .stat-item {
                padding: 8px 16px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 连击显示 -->
    <div class="combo-display" id="comboDisplay">🔥 COMBO x3!</div>

    <!-- 头部 -->
    <header class="header">
        <h1>🔥 网络热梗玩具箱</h1>
        <p class="subtitle">Meme Toy Box · 点击卡片解锁快乐</p>
    </header>

    <!-- 主容器 -->
    <div class="container">
        <!-- 统计栏 -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="totalClicks">0</div>
                <div class="stat-label">总点击</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="uniqueMemes">0</div>
                <div class="stat-label">已解锁</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="comboCount">0</div>
                <div class="stat-label">最高连击</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="memeCount">12</div>
                <div class="stat-label">热梗总数</div>
            </div>
        </div>

        <!-- 按钮组 -->
        <div class="btn-group">
            <button class="btn active" data-filter="all">全部</button>
            <button class="btn" data-filter="classic">经典</button>
            <button class="btn" data-filter="emoji">表情包</button>
            <button class="btn" data-filter="phrase">流行语</button>
            <button class="btn" data-filter="shuffle">🔀 随机打乱</button>
        </div>

        <!-- 热梗网格 -->
        <div class="meme-grid" id="memeGrid"></div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-emoji" id="modalEmoji">🎉</div>
            <h2 id="modalTitle">标题</h2>
            <p id="modalDesc">描述内容</p>
            <button class="modal-close" id="modalClose">关闭</button>
        </div>
    </div>

    <!-- 底部 -->
    <footer class="footer">
        <p>🔥 网络热梗玩具箱 v1.0 · 仅供娱乐 · 点击卡片有惊喜</p>
        <p style="margin-top:4px;">Made with ❤️ & JavaScript</p>
    </footer>

    <script>
        // 热梗数据
        const memes = [
            { id: 1, emoji: "😋", title: "真香", desc: "王境泽经典表情包，形容打脸现场", tag: "classic", color: "#ff6b6b" },
            { id: 2, emoji: "💀", title: "我太难了", desc: "表达生活压力与无奈的经典语录", tag: "classic", color: "#48dbfb" },
            { id: 3, emoji: "✨", title: "YYDS", desc: "永远的神！形容极其优秀的事物", tag: "phrase", color: "#feca57" },
            { id: 4, emoji: "🤡", title: "小丑竟是我自己", desc: "自嘲式表达，形容尴尬处境", tag: "emoji", color: "#ff9ff3" },
            { id: 5, emoji: "👀", title: "绝绝子", desc: "表示太绝了，好极了或太绝了", tag: "phrase", color: "#54a0ff" },
            { id: 6, emoji: "🧱", title: "搬砖", desc: "形容辛苦工作，打工人自嘲", tag: "classic", color: "#5f27cd" },
            { id: 7, emoji: "🐶", title: "单身狗", desc: "单身人士的自我调侃", tag: "emoji", color: "#ff6b6b" },
            { id: 8, emoji: "💪", title: "奥利给", desc: "加油打气，给力！", tag: "phrase", color: "#feca57" },
            { id: 9, emoji: "🤯", title: "破防了", desc: "心理防线被突破，感动或震惊", tag: "classic", color: "#48dbfb" },
            { id: 10, emoji: "🎭", title: "凡尔赛", desc: "低调炫耀，不经意间展示优越", tag: "phrase", color: "#ff9ff3" },
            { id: 11, emoji: "🦄", title: "独角兽", desc: "形容稀有、独特的美好事物", tag: "emoji", color: "#54a0ff" },
            { id: 12, emoji: "🔥", title: "燃起来了", desc: "形容激情澎湃，热血沸腾", tag: "classic", color: "#ff6b6b" },
        ];

        // 状态
        let totalClicks = 0;
        let uniqueClicked = new Set();
        let combo = 0;
        let maxCombo = 0;
        let lastClickTime = 0;
        let currentFilter = 'all';

        // DOM元素
        const grid = document.getElementById('memeGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalEmoji = document.getElementById('modalEmoji');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalClose = document.getElementById('modalClose');
        const comboDisplay = document.getElementById('comboDisplay');
        const totalClicksEl = document.getElementById('totalClicks');
        const uniqueMemesEl = document.getElementById('uniqueMemes');
        const comboCountEl = document.getElementById('comboCount');
        const memeCountEl = document.getElementById('memeCount');

        // 初始化
        function init() {
            memeCountEl.textContent = memes.length;
            renderMemes();
            createParticles();
            setupEventListeners();
        }

        // 渲染热梗卡片
        function renderMemes(filter = 'all') {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? memes : memes.filter(m => m.tag === filter);
            
            filtered.forEach((meme, index) => {
                const card = document.createElement('div');
                card.className = 'meme-card';
                card.dataset.id = meme.id;
                card.style.animationDelay = `${index * 0.05}s`;
                card.style.borderLeft = `3px solid ${meme.color}`;
                card.innerHTML = `
                    <div class="meme-counter">#${meme.id}</div>
                    <div class="meme-emoji">${meme.emoji}</div>
                    <div class="meme-title">${meme.title}</div>
                    <div class="meme-desc">${meme.desc}</div>
                    <div style="text-align:center;">
                        <span class="meme-tag" style="color:${meme.color};border-color:${meme.color}40">${getTagLabel(meme.tag)}</span>
                    </div>
                `;
                card.addEventListener('click', () => handleCardClick(meme, card));
                grid.appendChild(card);
            });
        }

        function getTagLabel(tag) {
            const labels = { classic: '经典', emoji: '表情包', phrase: '流行语' };
            return labels[tag] || tag;
        }

        // 处理卡片点击
        function handleCardClick(meme, card) {
            const now = Date.now();
            
            // 连击计算
            if (now - lastClickTime < 1000) {
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                if (combo >= 3) {
                    showCombo(combo);
                }
            } else {
                combo = 1;
            }
            lastClickTime = now;
            
            totalClicks++;
            uniqueClicked.add(meme.id);
            
            // 更新统计
            totalClicksEl.textContent = totalClicks;
            uniqueMemesEl.textContent = uniqueClicked.size;
            comboCountEl.textContent = maxCombo;
            
            // 卡片动画
            card.classList.remove('shake', 'pop');
            void card.offsetWidth; // 触发重绘
            card.classList.add('shake');
            
            // 弹窗
            setTimeout(() => {
                showModal(meme);
            }, 300);
        }

        // 显示连击
        function showCombo(count) {
            comboDisplay.textContent = `🔥 COMBO x${count}!`;
            comboDisplay.classList.add('show');
            setTimeout(() => {
                comboDisplay.classList.remove('show');
            }, 800);
        }

        // 显示弹窗
        function showModal(meme) {
            modalEmoji.textContent = meme.emoji;
            modalTitle.textContent = meme.title;
            modalDesc.textContent = meme.desc;
            modalOverlay.classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            modalOverlay.classList.remove('show');
        }

        // 创建粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd'];
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(particle);
            }
        }

        // 打乱数组
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 事件监听
        function setupEventListeners() {
            // 按钮过滤
            document.querySelectorAll('.btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    const filter = btn.dataset.filter;
                    if (filter === 'shuffle') {
                        // 打乱当前显示
                        const cards = Array.from(grid.children);
                        const shuffled = shuffleArray(cards);
                        shuffled.forEach(card => grid.appendChild(card));
                        // 重新绑定事件
                        shuffled.forEach(card => {
                            const meme = memes.find(m => m.id == card.dataset.id);
                            card.addEventListener('click', () => handleCardClick(meme, card));
                        });
                    } else {
                        renderMemes(filter);
                    }
                });
            });

            // 弹窗关闭
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // ESC关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
